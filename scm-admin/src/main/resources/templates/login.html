<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>登录</title>
    <meta name="description" content="医承云配供应链云平台">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <link href="../static/scm/css/ry-ui.css" th:href="@{/scm/css/ry-ui.css?v=4.8.0}" rel="stylesheet"/>
    <!-- 360浏览器急速模式 -->
    <meta name="renderer" content="webkit">
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style type="text/css">
        label.error { position:inherit; }
        /* 整体垂直水平居中登录卡片 */
        body.signin {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .signinpanel {
            max-width: 460px !important;
            width: 460px !important;
            margin: 0 auto;
        }
        .signinpanel .row {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.20);
        }
        .signinpanel,
        .signinpanel .signin-info,
        .signinpanel .signin-info h4,
        .signinpanel .signin-info ul li,
        .signinpanel .signin-info strong,
        .signinpanel .signup-footer {
            color: #333 !important;
        }
        .signinpanel .signin-info a {
            text-decoration: none;
        }
        .signinpanel .signin-info a.register-inline,
        .signinpanel .signin-info a.forgot-pwd-link {
            color: #0b83f0 !important;
        }
        .signinpanel .signin-info a.register-inline:hover,
        .signinpanel .signin-info a.forgot-pwd-link:hover {
            color: #0666c2 !important;
            text-decoration: underline;
        }
        .signinpanel .signin-info h4 {
            font-size: 30px;
        }
        .signinpanel .signin-info ul li {
            font-size: 16px;
        }
        .signinpanel #signupForm h3 {
            font-size: 26px;
        }
        .signinpanel #signupForm .form-control {
            height: 42px;
            font-size: 15px;
        }
        .remember-row-inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .forgot-pwd-link {
            color: #0b83f0 !important;
            font-size: 14px;
            cursor: pointer;
            margin-left: auto;
        }
        .signinpanel .register-inline {
            color: #0b83f0 !important;
            text-decoration: none;
        }
        .signinpanel .register-inline:hover {
            text-decoration: underline;
        }
        /* 验证码：与账号密码同一卡片内，输入框+图片同一行，无额外白框 */
        .captcha-inline {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        .captcha-inline .code {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0 !important;
            height: 42px;
        }
        .captcha-inline .captcha-img-link {
            flex: 0 0 auto;
            line-height: 0;
        }
        .captcha-inline .imgcode {
            height: 42px;
            width: auto;
            max-width: 140px;
            border-radius: 4px;
            cursor: pointer;
            vertical-align: middle;
        }
        /* 底部唤起登录按钮 */
        .login-entry-bar {
            position: fixed;
            left: 50%;
            bottom: 52px;
            transform: translateX(-50%);
            z-index: 30;
            text-align: center;
        }
        .login-entry-bar .btn-open-login {
            min-width: 210px;
            padding: 12px 30px;
            font-size: 17px;
            border-radius: 24px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #0b83f0;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            transition: all 0.25s ease;
        }
        .login-entry-bar .btn-open-login:hover {
            background: #0b83f0;
            color: #fff;
        }
        .login-entry-bar .btn-open-login:active {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
        }
        /* 背景遮罩层 */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 23, 45, 0.45);
            backdrop-filter: blur(3px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease;
            z-index: 10;
        }
        .login-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        /* 登录卡片的初始与展示动画 */
        .signinpanel {
            position: relative;
            z-index: 20;
            max-width: 460px !important;
            width: 460px !important;
            margin: 0 auto;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .login-panel-hidden {
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            pointer-events: none;
        }
        .login-panel-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        /* ICP 备案：固定底部，层级高于遮罩与登录卡片 */
        .login-icp-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 12px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            z-index: 50;
        }
        .login-icp-footer a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
        }
        .login-icp-footer a:hover {
            color: #fff;
            text-decoration: underline;
        }
        /* 忘记密码弹窗 */
        .forgot-modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(6, 23, 45, 0.5);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .forgot-modal-mask.active {
            display: flex;
        }
        .forgot-modal {
            width: 520px;
            max-width: 96vw;
            max-height: 92vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
            padding: 22px 28px 28px;
        }
        .forgot-modal-title {
            margin: 0;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1a5fb4;
            padding-bottom: 10px;
            border-bottom: 1px solid #d0d7de;
        }
        .forgot-modal-body {
            margin-top: 18px;
            background: #f5f6f8;
            border-radius: 8px;
            padding: 18px 16px 8px;
        }
        .forgot-form-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .forgot-form-row > label {
            flex: 0 0 140px;
            width: 140px;
            padding-top: 10px;
            text-align: right;
            font-size: 14px;
            color: #333;
            font-weight: normal;
        }
        .forgot-form-row .req-star {
            color: #c62828;
            margin-right: 2px;
        }
        .forgot-form-row .field-wrap {
            flex: 1 1 auto;
            min-width: 0;
            padding-left: 12px;
        }
        .forgot-form-row .form-control {
            height: 38px;
            margin-top: 0;
            background: #fff;
        }
        .forgot-form-row .form-control.has-error {
            border-color: #c62828;
            box-shadow: 0 0 0 1px rgba(198, 40, 40, 0.2);
        }
        .forgot-form-row .field-error {
            display: none;
            color: #c62828;
            font-size: 12px;
            margin-top: 4px;
            line-height: 1.3;
        }
        .forgot-form-row .field-error.show {
            display: block;
        }
        .forgot-modal-actions {
            text-align: center;
            margin-top: 8px;
            padding-top: 6px;
        }
        .forgot-modal-actions .btn-reset-pwd {
            min-width: 160px;
            height: 40px;
            font-size: 15px;
            background: #1ab394;
            border-color: #1ab394;
            color: #fff;
        }
        .forgot-modal-actions .btn-reset-pwd:hover {
            background: #18a689;
            border-color: #18a689;
            color: #fff;
        }
        .forgot-modal-close {
            float: right;
            margin-top: -4px;
            font-size: 22px;
            line-height: 1;
            color: #999;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0 4px;
        }
        .forgot-modal-close:hover {
            color: #333;
        }
    </style>
    <script>
        if(window.top!==window.self){alert('未登录或登录超时。请重新登录');window.top.location=window.location};
    </script>
</head>
<body class="signin">
    <!-- 底部入口按钮 -->
    <div class="login-entry-bar">
        <button type="button" class="btn-open-login">进入系统</button>
    </div>
    <!-- 遮罩层 -->
    <div class="login-overlay" id="loginOverlay"></div>
    <!-- 登录面板 -->
    <div class="signinpanel login-panel-hidden" id="loginPanel">
        <div class="row">
            <div class="col-sm-12">
                <div class="signin-info">
                    <div class="logopanel m-b" style="display: none;">
                        <h1><img alt="[ 耗材供应链 ]" src="../static/scm.png" th:src="@{/scm.png}"></h1>
                    </div>
                    <div class="m-b"></div>
                    <h4 style="color: #333; font-size: 28px;">医承云配供应链云平台</h4>
                    <form id="signupForm" autocomplete="off">
                        <h3 class="no-margins" style="font-size: 24px; margin: 8px 0 15px; color: #000;">登录：</h3>
                        <input type="text"     name="username" class="form-control uname"     placeholder="用户名" autocomplete="username" />
                        <input type="password" name="password" class="form-control pword"     placeholder="密码"   autocomplete="current-password" />
                        <div class="captcha-inline" th:if="${captchaEnabled==true}">
                            <input type="text" name="validateCode" class="form-control code" placeholder="验证码" maxlength="5" />
                            <a href="javascript:void(0);" class="captcha-img-link" title="点击更换验证码">
                                <img th:src="@{/captcha/captchaImage(type=${captchaType})}" class="imgcode"/>
                            </a>
                        </div>
                        <div class="remember-row-inline m-t">
                            <div class="checkbox-custom" th:if="${isRemembered}" th:classappend="${captchaEnabled==false} ? 'm-t'">
                                <input type="checkbox" id="rememberme" name="rememberme"> <label for="rememberme">记住我</label>
                            </div>
                            <a href="javascript:void(0);" class="forgot-pwd-link" id="btnForgotPwd">忘记密码</a>
                        </div>
                        <button class="btn btn-success" id="btnSubmit" data-loading="正在验证登录，请稍候..." style="width: 260px; display: block; margin: 0 auto;">登录</button>
                    </form>
                    <p class="m-b" style="font-size: 15px; text-align: center;">
                        <a class="register-inline" th:href="@{/supplier/register}">还没有账号？供应商注册</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <!-- 忘记密码弹窗 -->
    <div class="forgot-modal-mask" id="forgotModalMask">
        <div class="forgot-modal" role="dialog" aria-labelledby="forgotModalTitle">
            <button type="button" class="forgot-modal-close" id="btnCloseForgot" title="关闭">&times;</button>
            <h3 class="forgot-modal-title" id="forgotModalTitle">忘记密码</h3>
            <form id="forgotPwdForm" autocomplete="off">
                <div class="forgot-modal-body">
                    <div class="forgot-form-row">
                        <label for="forgotTaxNumber"><span class="req-star">*</span>统一社会信用代码</label>
                        <div class="field-wrap">
                            <input type="text" id="forgotTaxNumber" name="taxNumber" class="form-control" placeholder="统一社会信用代码" maxlength="50"/>
                            <div class="field-error" id="err-forgotTaxNumber">请输入您的统一社会信用代码</div>
                        </div>
                    </div>
                    <div class="forgot-form-row">
                        <label for="forgotPhone"><span class="req-star">*</span>管理员手机号</label>
                        <div class="field-wrap">
                            <input type="text" id="forgotPhone" name="adminPhone" class="form-control" placeholder="管理员手机号" maxlength="20"/>
                            <div class="field-error" id="err-forgotPhone">请输入您的管理员手机号</div>
                        </div>
                    </div>
                    <div class="forgot-form-row">
                        <label for="forgotLoginName"><span class="req-star">*</span>用户名</label>
                        <div class="field-wrap">
                            <input type="text" id="forgotLoginName" name="loginName" class="form-control uname" placeholder="账号" maxlength="30" autocomplete="username"/>
                            <div class="field-error" id="err-forgotLoginName">请输入您的用户名</div>
                        </div>
                    </div>
                    <div class="forgot-form-row">
                        <label for="forgotPassword"><span class="req-star">*</span>新登录密码</label>
                        <div class="field-wrap">
                            <input type="password" id="forgotPassword" name="password" class="form-control pword" placeholder="新密码" maxlength="20" autocomplete="new-password"/>
                            <div class="field-error" id="err-forgotPassword">新密码不能为空</div>
                        </div>
                    </div>
                    <div class="forgot-form-row">
                        <label for="forgotConfirmPassword"><span class="req-star">*</span>确认新密码</label>
                        <div class="field-wrap">
                            <input type="password" id="forgotConfirmPassword" name="confirmPassword" class="form-control pword" placeholder="确认密码" maxlength="20" autocomplete="new-password"/>
                            <div class="field-error" id="err-forgotConfirmPassword">确认密码不能为空</div>
                        </div>
                    </div>
                </div>
                <div class="forgot-modal-actions">
                    <button type="button" class="btn btn-reset-pwd" id="btnSubmitForgot">修改密码</button>
                </div>
            </form>
        </div>
    </div>
    <div class="login-icp-footer">
        <a th:href="${icpLink}" target="_blank" rel="noopener noreferrer" th:text="${icpNo}">冀ICP备2026009090号-1</a>
    </div>
<script th:inline="javascript"> var ctx = [[@{/}]]; var captchaType = [[${captchaType}]]; var captchaEnabled = [[${captchaEnabled}]];</script>
<!--[if lte IE 8]><script>window.location.href=ctx+'html/ie.html';</script><![endif]-->
<!-- 全局js -->
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
<script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script src="../static/scm/js/ry-ui.js" th:src="@{/scm/js/ry-ui.js?v=4.8.0}"></script>
<script src="../static/scm/login.js" th:src="@{/scm/login.js}"></script>
<script>
// 登录入口按钮与遮罩/卡片动画 + 忘记密码弹窗
$(function () {
    var $entryBar = $(".login-entry-bar");
    var $overlay = $("#loginOverlay");
    var $panel = $("#loginPanel");
    var $forgotMask = $("#forgotModalMask");

    function openLogin() {
        $entryBar.fadeOut(200);
        $overlay.addClass("active");
        setTimeout(function () {
            $panel.removeClass("login-panel-hidden").addClass("login-panel-visible");
        }, 80);
    }

    $(".btn-open-login").on("click", function () {
        openLogin();
    });

    function clearForgotErrors() {
        $("#forgotPwdForm .form-control").removeClass("has-error");
        $("#forgotPwdForm .field-error").removeClass("show");
    }

    function showForgotError(fieldId, msg) {
        var $input = $("#" + fieldId);
        $input.addClass("has-error");
        var $err = $("#err-" + fieldId);
        if (msg) {
            $err.text(msg);
        }
        $err.addClass("show");
    }

    function openForgotModal() {
        clearForgotErrors();
        $("#forgotPwdForm")[0].reset();
        $forgotMask.addClass("active");
    }

    function closeForgotModal() {
        $forgotMask.removeClass("active");
        clearForgotErrors();
    }

    $("#btnForgotPwd").on("click", function (e) {
        e.preventDefault();
        openForgotModal();
    });
    $("#btnCloseForgot").on("click", closeForgotModal);
    $forgotMask.on("click", function (e) {
        if (e.target === this) {
            closeForgotModal();
        }
    });

    function validateForgotForm() {
        clearForgotErrors();
        var ok = true;
        var taxNumber = $.trim($("#forgotTaxNumber").val());
        var phone = $.trim($("#forgotPhone").val());
        var loginName = $.trim($("#forgotLoginName").val());
        var password = $("#forgotPassword").val();
        var confirmPassword = $("#forgotConfirmPassword").val();

        if (!taxNumber) {
            showForgotError("forgotTaxNumber", "请输入您的统一社会信用代码");
            ok = false;
        }
        if (!phone) {
            showForgotError("forgotPhone", "请输入您的管理员手机号");
            ok = false;
        }
        if (!loginName) {
            showForgotError("forgotLoginName", "请输入您的用户名");
            ok = false;
        }
        if (!password) {
            showForgotError("forgotPassword", "新密码不能为空");
            ok = false;
        } else if (password.length < 6) {
            showForgotError("forgotPassword", "新密码长度不能少于6位");
            ok = false;
        }
        if (!confirmPassword) {
            showForgotError("forgotConfirmPassword", "确认密码不能为空");
            ok = false;
        } else if (password && confirmPassword !== password) {
            showForgotError("forgotConfirmPassword", "两次输入的密码不一致");
            ok = false;
        }
        return ok;
    }

    $("#btnSubmitForgot").on("click", function () {
        if (!validateForgotForm()) {
            return;
        }
        var $btn = $(this);
        $btn.prop("disabled", true);
        $.ajax({
            type: "post",
            url: ctx + "supplier/register/forgotPassword",
            dataType: "json",
            data: {
                taxNumber: $.trim($("#forgotTaxNumber").val()),
                adminPhone: $.trim($("#forgotPhone").val()),
                loginName: $.trim($("#forgotLoginName").val()),
                password: $("#forgotPassword").val(),
                confirmPassword: $("#forgotConfirmPassword").val()
            },
            success: function (r) {
                if (r.code == web_status.SUCCESS) {
                    $.modal.msgSuccess(r.msg || "密码修改成功，请使用新密码登录");
                    closeForgotModal();
                } else {
                    $.modal.msg(r.msg || "修改失败");
                }
            },
            error: function () {
                $.modal.msg("系统异常，请稍后重试");
            },
            complete: function () {
                $btn.prop("disabled", false);
            }
        });
    });
});
</script>
</body>
</html>
