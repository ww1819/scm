<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('第三方订单详情')" />
	<th:block th:include="include :: layout-latest-css" />
	<th:block th:include="include :: bootstrap-table-fixed-columns-css" />
	<style>
		body.order-detail-page {
			height: 100%;
			overflow: hidden;
		}
		.order-detail-page .main-content {
			display: flex;
			flex-direction: column;
			height: 100%;
			min-height: 480px;
			overflow: hidden;
			box-sizing: border-box;
		}
		.order-detail-basic {
			flex-shrink: 0;
		}
		#form-order-detail.order-basic-fields .form-group {
			margin-bottom: 10px;
		}
		#form-order-detail.order-basic-fields .control-label {
			padding-right: 4px;
			padding-left: 0;
			white-space: nowrap;
		}
		#form-order-detail .col-order-5 {
			position: relative;
			min-height: 1px;
			padding-left: 6px;
			padding-right: 6px;
			float: left;
			width: 20%;
			box-sizing: border-box;
		}
		.order-info-box.search-collapse {
			margin: 0 10px 10px 10px;
			padding: 10px 8px 6px;
			background: #fff !important;
			box-shadow: none !important;
		}
		.order-info-box .form-control[readonly] {
			background-color: #fff;
			border-color: #e5e6e7;
		}
		.order-basic-header-row {
			margin-bottom: 8px !important;
		}
		.order-detail-table-section {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
			margin-top: 4px;
			padding: 0 10px 10px;
			overflow: hidden;
		}
		.order-detail-table-section .form-header {
			flex-shrink: 0;
			margin: 4px 0 8px 0 !important;
			padding-bottom: 5px !important;
		}
		.order-detail-table-wrap {
			flex: 1;
			min-height: 0;
			position: relative;
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		.order-detail-table-wrap.select-table {
			margin: 0 !important;
			padding: 0 !important;
			box-shadow: none !important;
			border-radius: 0 !important;
			background: transparent !important;
		}
		.order-detail-table-wrap .fixed-table-toolbar {
			display: none !important;
			height: 0 !important;
			min-height: 0 !important;
			margin: 0 !important;
			padding: 0 !important;
			border: 0 !important;
		}
		.order-detail-table-wrap > .bootstrap-table {
			flex: 1 1 auto;
			min-height: 0;
			height: 100%;
			display: flex;
			flex-direction: column;
			margin: 0 !important;
			padding: 0 !important;
		}
		.order-detail-table-wrap .fixed-table-container {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			margin: 0 !important;
			padding: 0 !important;
		}
		.order-detail-table-wrap .fixed-table-body {
			flex: 1;
			min-height: 0;
			overflow-x: scroll !important;
			overflow-y: auto !important;
		}
		.order-detail-table-wrap .fixed-table-header {
			position: relative;
			background: #fff;
		}
		.order-detail-table-wrap .fixed-table-header table.table,
		.order-detail-table-wrap .fixed-table-body table.table {
			border-collapse: collapse;
			table-layout: fixed;
		}
		#bootstrap-table.order-detail-fixed-table {
			table-layout: fixed !important;
		}
		.order-detail-table-wrap .fixed-table-header th .th-inner,
		.order-detail-table-wrap .fixed-table-header th .sortable,
		#bootstrap-table thead th .th-inner,
		#bootstrap-table thead th .sortable {
			padding: 4px 10px !important;
			font-size: 14px !important;
			line-height: 1.3;
			font-weight: normal;
			text-align: center !important;
			overflow: hidden !important;
			text-overflow: ellipsis !important;
			white-space: nowrap !important;
		}
		.order-detail-table-wrap .fixed-table-header th .th-inner.sortable,
		.order-detail-table-wrap .fixed-table-header th .sortable,
		#bootstrap-table thead th .th-inner.sortable,
		#bootstrap-table thead th .sortable {
			padding: 4px 28px 4px 8px !important;
			background-position: right 6px center !important;
			background-repeat: no-repeat !important;
			background-size: 12px 14px !important;
			cursor: pointer;
		}
		.order-detail-table-wrap .fixed-table-header th,
		#bootstrap-table thead th {
			box-sizing: border-box !important;
			border: 1px solid #e7eaec !important;
			padding: 4px 10px !important;
			white-space: nowrap !important;
			word-break: keep-all !important;
			overflow: hidden;
			text-overflow: ellipsis;
			vertical-align: middle !important;
			text-align: center !important;
			background-color: #f5f5f5 !important;
			font-size: 14px !important;
			font-weight: normal;
			color: #333;
			border-bottom: 2px solid #ddd !important;
		}
		.order-detail-table-wrap .fixed-table-header th[data-field="index"],
		.order-detail-table-wrap .fixed-table-body td[data-field="index"] {
			width: 76px !important;
			min-width: 76px !important;
			max-width: 76px !important;
		}
		.order-detail-table-wrap .fixed-table-body > table,
		.order-detail-table-wrap .fixed-table-body > table > tbody {
			height: auto !important;
			min-height: 0 !important;
		}
		.order-detail-table-wrap .fixed-table-body > table > tbody > tr,
		#bootstrap-table tbody tr,
		.order-detail-table-wrap .fixed-columns-right .fixed-table-body tbody tr {
			height: 36px !important;
			max-height: 36px !important;
			min-height: 36px !important;
		}
		.order-detail-table-wrap .fixed-table-body td,
		#bootstrap-table tbody td,
		.order-detail-table-wrap .fixed-columns-right .fixed-table-body td {
			box-sizing: border-box !important;
			border: 1px solid #e7eaec !important;
			padding: 4px 8px !important;
			white-space: nowrap !important;
			word-break: keep-all !important;
			overflow: hidden;
			text-overflow: ellipsis;
			vertical-align: middle !important;
			text-align: center !important;
			background-color: #fff;
			font-size: 13px !important;
			color: #333;
			height: 36px !important;
			line-height: 1.42857143 !important;
		}
		.order-detail-table-wrap .fixed-table-body .fixed-table-border {
			display: none !important;
			height: 0 !important;
			min-height: 0 !important;
			max-height: 0 !important;
			border: 0 !important;
		}
		.order-detail-table-wrap .fixed-table-pagination {
			display: none !important;
		}
		.order-detail-table-wrap .fixed-columns-right {
			z-index: 5;
			box-shadow: -4px 0 8px rgba(0, 0, 0, 0.08);
		}
		.order-detail-table-wrap .fixed-columns-right .fixed-table-header th {
			background-color: #f5f5f5 !important;
		}
		.order-detail-table-wrap .fixed-table-container > .fixed-table-header th[data-field="tpOperate"],
		.order-detail-table-wrap .fixed-table-container > .fixed-table-body td[data-field="tpOperate"] {
			padding: 0 !important;
			border-left: 0 !important;
			border-right: 0 !important;
			font-size: 0;
			line-height: 0;
			color: transparent;
			overflow: hidden;
		}
		.order-detail-table-wrap .fixed-table-container > .fixed-table-header th[data-field="tpOperate"] > *,
		.order-detail-table-wrap .fixed-table-container > .fixed-table-body td[data-field="tpOperate"] > * {
			display: none;
		}
		.order-detail-table-wrap .fixed-columns-right .fixed-table-header th[data-field="tpOperate"],
		.order-detail-table-wrap .fixed-columns-right .fixed-table-body td[data-field="tpOperate"] {
			min-width: 110px !important;
			width: 110px !important;
			max-width: 110px !important;
			font-size: 13px !important;
			line-height: 1.42857143 !important;
			color: #333 !important;
			padding: 4px 8px !important;
		}
		.order-detail-table-wrap.table-striped .fixed-columns-right .fixed-table-body tbody tr:nth-of-type(odd) td {
			background-color: #f9f9f9;
		}
		.order-detail-table-wrap .order-detail-cell-text {
			display: block;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			line-height: 1.42857143;
		}
		.order-detail-table-wrap .fixed-table-body td[title],
		.order-detail-table-wrap .order-detail-cell-text[title] {
			cursor: help;
		}
	</style>
</head>
<body class="gray-bg order-detail-page">
    <div class="main-content">
        <div class="order-detail-basic">
        <form id="form-order-detail" class="form-horizontal order-basic-fields">
            <div class="order-basic-header-row" style="display:flex;align-items:center;justify-content:space-between;margin:6px 10px 8px 10px;padding-bottom:5px;border-bottom:1px solid #ddd;">
                <h4 class="form-header h4" style="margin:0;border:0;padding:0;">订单信息</h4>
                <div style="display:flex;align-items:center;gap:8px;">
                    <a class="btn btn-sm btn-default" href="javascript:void(0)" onclick="openDeliveries()">
                        <i class="fa fa-truck"></i> 关联配送单
                    </a>
                    <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i> 关 闭</button>
                </div>
            </div>
            <div class="search-collapse order-info-box">
            <div class="row">
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">单号：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null ? head.dh : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">医院：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null ? head.hospitalName : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">供应商：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null ? head.supplierName : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">订单金额：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null && head.sheetJe != null ? #numbers.formatDecimal(head.sheetJe, 1, 2) : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">要货仓库：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null ? head.ck : ''}" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">申请科室：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null ? head.ksmc : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">服务标识：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null ? head.customer : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-order-5">
                    <div class="form-group">
                        <label class="col-sm-5 control-label">推送日期：</label>
                        <div class="col-sm-7">
                            <input class="form-control" type="text" th:value="${head != null && head.createTime != null ? #dates.format(head.createTime, 'yyyy-MM-dd') : ''}" readonly>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </form>
        </div>

        <div class="order-detail-table-section">
            <h4 class="form-header h4">订单明细</h4>
            <div class="order-detail-table-wrap select-table table-striped">
                <table id="bootstrap-table" class="order-detail-fixed-table"></table>
            </div>
        </div>
    </div>

	<th:block th:include="include :: footer" />
	<th:block th:include="include :: layout-latest-js" />
	<th:block th:include="include :: bootstrap-table-fixed-columns-js" />
	<script th:inline="javascript">
		var zsOrderId = [[${zsOrderId}]];
		var prefix = ctx + "order/zstp";
		var tableId = "bootstrap-table";

		function calculateOrderDetailTableHeight() {
		    var $wrap = $('.order-detail-table-wrap');
		    if ($wrap.length === 0) {
		        return 400;
		    }
		    var h = $wrap[0].clientHeight || $wrap.innerHeight();
		    h = Math.floor(h - 8);
		    return Math.max(h, 200);
		}

		function layoutOrderDetailTableWrap() {
		    var $section = $('.order-detail-table-section');
		    var $page = $('.order-detail-page .main-content');
		    if ($section.length === 0 || $page.length === 0) {
		        return;
		    }
		    var bottom = $page[0].getBoundingClientRect().bottom;
		    var $tc = $section.closest('.tab-content');
		    if ($tc.length) {
		        bottom = Math.min(bottom, $tc[0].getBoundingClientRect().bottom - 4);
		    }
		    var $pane = $section.closest('.tab-pane');
		    if ($pane.length && $pane.is(':visible')) {
		        bottom = Math.min(bottom, $pane[0].getBoundingClientRect().bottom - 4);
		    }
		    var $wrap = $section.find('.order-detail-table-wrap');
		    if ($wrap.length === 0) {
		        return;
		    }
		    var top = $wrap[0].getBoundingClientRect().top;
		    var h = Math.floor(bottom - top - 14);
		    if (h < 200) {
		        h = 200;
		    }
		    $wrap.css({ height: h + 'px', minHeight: h + 'px', flex: '0 0 auto' });
		}

		function resetOrderDetailTableHeight() {
		    var $table = $('#' + tableId);
		    if ($table.length > 0 && $table.bootstrapTable('getOptions')) {
		        $table.bootstrapTable('resetView', { height: calculateOrderDetailTableHeight() });
		    }
		}

		function fixDetailTableHeaderAlign() {
		    var $container = $('#' + tableId).closest('.bootstrap-table').find('.fixed-table-container').first();
		    var $mainBody = $container.children('.fixed-table-body');
		    var $mainHeader = $container.children('.fixed-table-header');
		    if ($mainBody.length && $mainBody[0] && $mainHeader.length) {
		        var scrollW = $mainBody[0].offsetWidth - $mainBody[0].clientWidth;
		        $mainHeader.css('margin-right', scrollW > 0 ? (scrollW + 'px') : '');
		    }
		}

		function bindOrderDetailTableScrollSync() {
		    var $container = $('#' + tableId).closest('.bootstrap-table').find('.fixed-table-container').first();
		    var $mainBody = $container.children('.fixed-table-body');
		    var $mainHeader = $container.children('.fixed-table-header');
		    $mainBody.off('scroll.orderDetailSync').on('scroll.orderDetailSync', function () {
		        $mainHeader.scrollLeft($mainBody.scrollLeft());
		    });
		}

		function bindOrderDetailCellTitles() {
		    $('.order-detail-table-wrap .fixed-table-body tbody td').each(function() {
		        var $td = $(this);
		        if ($td.find('a.btn, .btn').length) {
		            $td.removeAttr('title');
		            return;
		        }
		        var text = $.trim($td.text());
		        if (!text) {
		            $td.removeAttr('title');
		            return;
		        }
		        if (this.scrollWidth > this.clientWidth + 1) {
		            $td.attr('title', text);
		        } else {
		            $td.removeAttr('title');
		        }
		    });
		}

		function refreshDetailTableLayout() {
		    fixDetailTableHeaderAlign();
		    bindOrderDetailTableScrollSync();
		    bindOrderDetailCellTitles();
		}

		var refreshDetailTableLayoutTimer = null;
		function refreshDetailTableLayoutDebounced() {
		    if (refreshDetailTableLayoutTimer) {
		        clearTimeout(refreshDetailTableLayoutTimer);
		    }
		    refreshDetailTableLayoutTimer = setTimeout(function () {
		        refreshDetailTableLayoutTimer = null;
		        refreshDetailTableLayout();
		    }, 60);
		}

		function relayoutOrderDetailTable() {
		    layoutOrderDetailTableWrap();
		    resetOrderDetailTableHeight();
		    refreshDetailTableLayoutDebounced();
		}

		function fmtQty(value) {
		    if (value != null && value !== '') {
		        return parseFloat(value).toFixed(2);
		    }
		    return '0.00';
		}

		function fmtCellText(value) {
		    if (value == null || value === '') {
		        return '-';
		    }
		    var s = String(value);
		    return '<span class="order-detail-cell-text" title="' + $('<div/>').text(s).html() + '">' + $('<div/>').text(s).html() + '</span>';
		}

		function fmtAudit(v) {
		    var m = { '0': '待审核', '1': '已审核', '2': '已拒绝' };
		    return m[v] || (v == null ? '' : v);
		}
		function fmtDoc(v) {
		    var m = { '0': '未审核', '1': '已审核', '2': '已配送', '3': '已入库' };
		    return m[v] || (v == null ? '' : v);
		}

		$(function() {
		    layoutOrderDetailTableWrap();
		    queryDetailList();
		    $(window).on('resize', function() {
		        relayoutOrderDetailTable();
		    });
		    setTimeout(relayoutOrderDetailTable, 0);
		    setTimeout(relayoutOrderDetailTable, 200);
		});

		function queryDetailList() {
		    var options = {
		        id: tableId,
		        url: prefix + "/detailList",
		        queryParams: { zsOrderId: zsOrderId },
		        sortName: "id",
		        sortOrder: "asc",
		        sidePagination: 'client',
		        pagination: false,
		        search: false,
		        showSearch: false,
		        showRefresh: false,
		        showToggle: false,
		        showColumns: false,
		        striped: true,
		        mobileResponsive: false,
		        fixedColumns: true,
		        fixedNumber: 0,
		        fixedRightNumber: 1,
		        height: calculateOrderDetailTableHeight(),
		        onPostBody: function() {
		            bindOrderDetailTableScrollSync();
		            refreshDetailTableLayoutDebounced();
		        },
		        onLoadSuccess: function () {
		            bindOrderDetailTableScrollSync();
		            refreshDetailTableLayoutDebounced();
		            setTimeout(relayoutOrderDetailTable, 0);
		        },
		        columns: [
		            {
		                field: 'index',
		                title: '序号',
		                align: 'center',
		                width: 76,
		                formatter: function(value, row, index) {
		                    return index + 1;
		                }
		            },
		            { field: 'code', title: '产品编码', align: 'center', width: 120, formatter: fmtCellText },
		            { field: 'name', title: '产品名称', align: 'center', width: 180, formatter: fmtCellText },
		            { field: 'gg', title: '规格', align: 'center', width: 150, formatter: fmtCellText },
		            { field: 'sl', title: '数量', align: 'center', width: 90, formatter: fmtQty },
		            { field: 'dj', title: '单价', align: 'center', width: 100, formatter: fmtQty },
		            { field: 'je', title: '金额', align: 'center', width: 110, formatter: fmtQty },
		            { field: 'zcz', title: '注册证号', align: 'center', width: 160, formatter: fmtCellText },
		            { field: 'sccj', title: '生产厂家', align: 'center', width: 160, formatter: fmtCellText },
		            { field: 'deliveredAuditedQty', title: '已配送(已审核)', align: 'center', width: 130, formatter: fmtQty },
		            { field: 'deliveredPendingAuditQty', title: '待审核配送', align: 'center', width: 110, formatter: fmtQty },
		            { field: 'undeliveredQty', title: '未配送', align: 'center', width: 96, formatter: fmtQty },
		            {
		                field: 'tpOperate',
		                title: '操作',
		                align: 'center',
		                width: 110,
		                formatter: function(value, row) {
		                    return '<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="openLineTraces(\'' + row.id + '\')"><i class="fa fa-link"></i> 配送明细</a>';
		                }
		            }
		        ]
		    };
		    $.table.init(options);
		}

		function openDeliveries() {
		    var delTableId = "bootstrap-table-zs-del";
		    layer.open({
		        type: 1,
		        area: ['900px', '420px'],
		        title: '关联配送单',
		        content: '<table id="' + delTableId + '"></table>',
		        success: function() {
		            $('#' + delTableId).bootstrapTable({
		                url: prefix + '/deliveriesByZs/' + zsOrderId,
		                method: 'post',
		                contentType: "application/x-www-form-urlencoded",
		                pagination: false,
		                search: false,
		                showRefresh: false,
		                sidePagination: 'server',
		                responseHandler: ruoyiTableData,
		                columns: [
		                    { field: 'deliveryNo', title: '配送单号' },
		                    { field: 'auditStatus', title: '审核状态', formatter: fmtAudit },
		                    { field: 'deliveryStatus', title: '单据状态', formatter: fmtDoc },
		                    { field: 'deliveryAmount', title: '配送金额' },
		                    { title: '操作', formatter: function(v, row) {
		                        return '<a href="javascript:void(0)" onclick="openDeliveryView(' + row.deliveryId + ')">查看</a>';
		                    }}
		                ]
		            });
		        }
		    });
		}

		function openDeliveryView(deliveryId) {
		    $.modal.openTab('配送单详情', ctx + 'delivery/delivery/detail/' + deliveryId);
		}

		function openLineTraces(zsDetailId) {
		    var tid = 'bootstrap-table-zs-line';
		    layer.open({
		        type: 1,
		        area: ['900px', '400px'],
		        title: '本行关联的配送明细',
		        content: '<table id="' + tid + '"></table>',
		        success: function() {
		            $('#' + tid).bootstrapTable({
		                url: prefix + '/detailDeliveryTraces',
		                method: 'post',
		                contentType: "application/x-www-form-urlencoded",
		                queryParams: { zsOrderDetailId: zsDetailId, zsOrderId: zsOrderId },
		                pagination: false,
		                sidePagination: 'server',
		                responseHandler: ruoyiTableData,
		                columns: [
		                    { field: 'deliveryNo', title: '配送单号' },
		                    { field: 'deliveryQuantity', title: '本行配送数量', formatter: fmtQty },
		                    { field: 'auditStatus', title: '审核状态', formatter: fmtAudit },
		                    { field: 'deliveryStatus', title: '单据状态', formatter: fmtDoc },
		                    { title: '操作', formatter: function(v, row) {
		                        return '<a href="javascript:void(0)" onclick="openDeliveryView(' + row.deliveryId + ')">配送单</a>';
		                    }}
		                ]
		            });
		        }
		    });
		}
	</script>
</body>
</html>
