<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('产品证件审核')" />
	<th:block th:include="include :: layout-latest-css" />
	<style>
		#bootstrap-table-supplier td,
		#bootstrap-table-supplier th {
			white-space: nowrap !important;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.audit-page-wrap.container-div {

		.audit-right-area .audit-cert-detail-wrap .fixed-table-container > .fixed-table-body thead th,

		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-header th .th-inner,
		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-header th .sortable,

		.audit-right-area .audit-cert-detail-wrap .fixed-table-container > .fixed-table-header th .th-inner,
		.audit-right-area .audit-cert-detail-wrap .fixed-table-container > .fixed-table-header th .sortable,
		.audit-right-area .audit-cert-detail-wrap .fixed-table-container > .fixed-table-body thead th .th-inner {

			box-sizing: border-box;
			vertical-align: middle;
			overflow: visible !important;
			text-overflow: clip !important;
			white-space: nowrap !important;
			padding-right: 18px !important;
			background-position: right center !important;
		}

		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-header th.bs-checkbox,
		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-body td.bs-checkbox,

		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-body tbody td,

		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-body td[data-field="materialName"] .tooltip-show,
		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-body td[data-field="supplierName"] .tooltip-show,
		.audit-right-area .audit-table-wrap.audit-list-table .fixed-table-container > .fixed-table-body td[data-field="manufacturerName"] .tooltip-show {

		#bootstrap-table-supplier {

<body class="gray-bg">
	<div class="container-div audit-page-wrap">
		<div class="row audit-page-row">
			<div class="audit-split-area">
				<div class="audit-left-panel">
					<div class="panel panel-default" style="margin-bottom: 0; display: flex; flex-direction: column; height: 100%; border: none; box-shadow: none;">
						<div class="panel-heading audit-left-panel-heading">
							<h5 class="panel-title" style="margin: 0; font-size: 14px;">
								<i class="fa fa-building"></i> 供应商
							</h5>
						</div>
						<div class="panel-body audit-left-panel-body">
							<div class="select-table table-striped audit-left-table-wrap">
								<table id="bootstrap-table-supplier" style="width: 100%;"></table>
							</div>
						</div>
					</div>
				</div>

				<div class="audit-right-area">
					<form id="product-certificate-form">
						<div class="btn-group-sm" id="toolbar" role="group">
							<label class="toolbar-filter-item">
								<span class="toolbar-filter-label">供应商名称</span>
								<input type="text" name="supplierName" class="form-control input-sm toolbar-filter-input"/>
							</label>
							<label class="toolbar-filter-item">
								<span class="toolbar-filter-label">产品名称</span>
								<input type="text" name="materialName" class="form-control input-sm toolbar-filter-input"/>
							</label>
							<label class="toolbar-filter-item">
								<span class="toolbar-filter-label">状态</span>
								<select name="auditStatusFilter" id="auditStatusFilter" class="form-control input-sm toolbar-filter-select">
									<option value="">全部</option>
									<option value="1">已审核</option>
									<option value="0">待审核</option>
								</select>
							</label>
							<a class="btn btn-primary btn-sm" onclick="searchAudit()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							<a class="btn btn-info single disabled btn-product-audit" onclick="auditCertificate()" shiro:hasPermission="certificate:product:audit">
								<i class="fa fa-check"></i> 审核
							</a>
						</div>
					</form>

					<div class="select-table table-striped audit-table-wrap audit-list-table">
						<table id="bootstrap-table"></table>
					</div>

					<div class="select-table table-striped audit-cert-detail-wrap">
						<table id="bootstrap-table-cert-detail"></table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block th:include="include :: footer" />
	<th:block th:include="include :: layout-latest-js" />
	<script th:src="@{/js/common/scmCosDownload.js}"></script>
	<script th:src="@{/js/certificate/certCosPreview.js}"></script>
	<script th:inline="javascript">
		var prefix = ctx + "certificate/product";
		var supplierPrefix = ctx + "supplier/supplier";
		var auditFlag = [[${@permission.hasPermi('certificate:product:audit')}]];
		var selectedSupplierId = null;
		var allSuppliers = [];
		var auditTableId = 'bootstrap-table';
		var certDetailTableId = 'bootstrap-table-cert-detail';
		var selectedCertificateId = null;

		$(function() {
			initLeftSupplierTable();
			initCertDetailTable();
			queryProductCertificateAuditList();

			$(window).resize(function() {
				adjustAuditTableHeight();
				adjustCertDetailTableHeight();
				setTimeout(function() {
					refreshAuditTableLayout();
					refreshCertDetailTableLayout();
				}, 100);
				var $supplierTable = $('#bootstrap-table-supplier');
				if ($supplierTable.length && $supplierTable.bootstrapTable('getOptions')) {
					$supplierTable.bootstrapTable('resetView', { height: calculateLeftSupplierTableHeight() });
				}
			});

			setTimeout(function() {
				adjustAuditTableHeight();
				adjustCertDetailTableHeight();
				refreshCertDetailTableLayout();
			}, 300);
		});

		function formatCertDate(value) {
			if (!value) {
				return '-';
			}
			if (typeof value === 'string' && value.indexOf('-') > -1) {
				return value.split(' ')[0];
			}
			if (value instanceof Date && typeof $.common !== 'undefined' && $.common.formatDate) {
				return $.common.formatDate(value, 'yyyy-MM-dd');
			}
			return value;
		}

		function ellipsisText(value) {
			if (value === null || value === undefined || value === '') {
				return '-';
			}
			var text = String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
			var title = String(value).replace(/"/g, '&quot;');
			return '<span title="' + title + '" style="display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;">' + text + '</span>';
		}

		function calculateCertDetailTableHeight() {
			var $wrap = $('.audit-cert-detail-wrap');
			if ($wrap.length === 0) {
				return 180;
			}
			return Math.max($wrap.innerHeight() - 2, 120);
		}

		function adjustCertDetailTableHeight() {
			var $table = $('#' + certDetailTableId);
			if ($table.length === 0 || !$table.bootstrapTable('getOptions')) {
				return;
			}
			$table.bootstrapTable('resetView', { height: calculateCertDetailTableHeight() });
			refreshCertDetailTableLayout();
		}

		function initCertDetailTable() {
			$('#' + certDetailTableId).bootstrapTable({
				locale: 'zh-CN',
				striped: true,
				cache: false,
				pagination: false,
				showRefresh: false,
				showColumns: false,
				showToggle: false,
				search: false,
				sortable: true,
				sortName: 'licenseNo',
				sortOrder: 'asc',
				height: calculateCertDetailTableHeight(),
				data: [],
				onPostBody: function() {
					refreshCertDetailTableLayout();
				},
				columns: [{
					field: 'serialNumber',
					title: '序号',
					align: 'left',
					halign: 'left',
					width: 70,
					formatter: function(value, row, index) {
						return index + 1;
					}
				},
				{
					field: 'licenseKindCode',
					title: '证件编号',
					align: 'left',
					halign: 'left',
					width: 110,
					sortable: true,
					formatter: function(value, row) {
						return ellipsisText(value || row.licenseKindCode || '-');
					}
				},
				{
					field: 'licenseKindName',
					title: '证件类型',
					align: 'left',
					halign: 'left',
					width: 200,
					sortable: true,
					formatter: function(value, row) {
						return ellipsisText(value || row.licenseKindCode || '-');
					}
				},
				{
					field: 'licenseNo',
					title: '证件编码',
					align: 'left',
					halign: 'left',
					width: 140,
					sortable: true,
					formatter: function(value) {
						return ellipsisText(value || '-');
					}
				},
				{
					field: 'expireDate',

		/** 通用：表头交界拖拽调列宽，表头/表体同步 */
		function createColResizeController(options) {
			var tableId = options.tableId;
			var ns = options.ns;
			var skipFields = options.skipFields || {};
			var checkboxColWidth = options.checkboxWidth || 36;
			var colWidths = options.colWidths || {};
			var resizing = false;
			var syncHandlesKey = '__syncResizeHandles_' + ns;

			function getFixedTables() {
				var $container = $('#' + tableId).closest('.bootstrap-table').find('.fixed-table-container').first();
				var $mainHeader = $container.children('.fixed-table-header');
				var $mainBody = $container.children('.fixed-table-body');
				var $headTable = $mainHeader.find('table').not('.fixed-table-border').first();
				var $bodyTable = $mainBody.find('#' + tableId);
				if (!$bodyTable.length) {
					$bodyTable = $mainBody.find('table').not('.fixed-table-border').first();
				}
				return {
					$container: $container,
					$mainHeader: $mainHeader,
					$mainBody: $mainBody,
					$headTable: $headTable,
					$bodyTable: $bodyTable
				};
			}

			function ensureColgroup($table, colCount) {
				if (!$table || !$table.length) {
					return $();
				}
				var $colgroup = $table.children('colgroup');
				if (!$colgroup.length) {
					$colgroup = $('<colgroup></colgroup>');
					$table.prepend($colgroup);
				}
				while ($colgroup.children('col').length < colCount) {
					$colgroup.append('<col />');
				}
				while ($colgroup.children('col').length > colCount) {
					$colgroup.children('col:last').remove();
				}
				return $colgroup;
			}

			function applyFromHeader() {
				var tables = getFixedTables();
				var $headTable = tables.$headTable;
				var $bodyTable = tables.$bodyTable;
				var $mainBody = tables.$mainBody;
				var $mainHeader = tables.$mainHeader;
				if (!$headTable.length || !$bodyTable.length) {
					return;
				}
				$headTable[0].style.setProperty('table-layout', 'fixed', 'important');
				$bodyTable[0].style.setProperty('table-layout', 'fixed', 'important');

				var $ths = $headTable.find('thead tr:first > th');
				var headColCount = $ths.length;
				if (headColCount < 1) {
					return;
				}
				var $bodyThs = $bodyTable.find('thead tr:first > th');
				var bodyColCount = Math.max(headColCount, $bodyThs.length);
				ensureColgroup($headTable, headColCount);
				ensureColgroup($bodyTable, bodyColCount);

				var totalW = 0;
				var setW = function(el, w) {
					if (!el) {
						return;
					}
					var ws = w + 'px';
					el.style.setProperty('width', ws, 'important');
					el.style.setProperty('min-width', ws, 'important');
					el.style.setProperty('max-width', ws, 'important');
				};

				$ths.each(function(idx) {
					var $th = $(this);
					var field = $th.attr('data-field');
					var headIdx = this.cellIndex >= 0 ? this.cellIndex : idx;
					var w;
					if ($th.hasClass('bs-checkbox') || field === '0' || field === 'state') {
						w = checkboxColWidth;
					} else if (field && colWidths[field] != null) {
						w = colWidths[field];
					} else {
						w = Math.max(48, Math.ceil($th.outerWidth()) || 80);
						if (field) {
							colWidths[field] = w;
						}
					}

					var bodyIdx = headIdx;
					if (field && $bodyThs.length) {
						var matched = -1;
						$bodyThs.each(function(i) {
							if ($(this).attr('data-field') === field) {
								matched = this.cellIndex >= 0 ? this.cellIndex : i;
								return false;
							}
						});
						if (matched >= 0) {
							bodyIdx = matched;
						}
					}

					setW(this, w);
					$th.find('.fht-cell').each(function() { setW(this, w); });
					$headTable.children('colgroup').children('col').eq(headIdx).each(function() { setW(this, w); });
					$bodyTable.children('colgroup').children('col').eq(bodyIdx).each(function() { setW(this, w); });

					var $bodyTh = $bodyThs.eq(bodyIdx);
					if (!$bodyTh.length && field) {
						$bodyTh = $bodyTable.find('thead tr:first > th[data-field="' + field + '"]');
					}
					if ($bodyTh.length) {
						setW($bodyTh[0], w);
						$bodyTh.find('.fht-cell').each(function() { setW(this, w); });
					}

					$bodyTable.find('tbody tr').each(function() {
						if (!this.cells || !this.cells.length) {
							return;
						}
						if (this.cells.length === 1 && this.cells[0].colSpan > 1) {
							return;
						}
						var cell = this.cells[bodyIdx];
						if (cell) {
							setW(cell, w);
						}
					});
					if (field) {
						$mainBody.children('table').find('td[data-field="' + field + '"]').each(function() {
							setW(this, w);
						});
					}
					totalW += w;
				});

				if (totalW > 0) {
					var tw = totalW + 'px';
					$headTable[0].style.setProperty('width', tw, 'important');
					$headTable[0].style.setProperty('min-width', tw, 'important');
					$headTable[0].style.setProperty('max-width', tw, 'important');
					$bodyTable[0].style.setProperty('width', tw, 'important');
					$bodyTable[0].style.setProperty('min-width', tw, 'important');
					$bodyTable[0].style.setProperty('max-width', tw, 'important');
				}

				if ($mainBody.length && $mainHeader.length) {
					var scrollW = $mainBody[0].offsetWidth - $mainBody[0].clientWidth;
					$mainHeader.css('margin-right', scrollW > 0 ? (scrollW + 'px') : '');
					$mainHeader.scrollLeft($mainBody.scrollLeft());
				}
			}

			function fixHeaderAlign() {
				var tables = getFixedTables();
				if (!tables.$mainBody.length || !tables.$mainHeader.length) {
					return;
				}
				var scrollW = tables.$mainBody[0].offsetWidth - tables.$mainBody[0].clientWidth;
				tables.$mainHeader.css('margin-right', scrollW > 0 ? (scrollW + 'px') : '');
				applyFromHeader();
			}

			function bindHScroll() {
				var tables = getFixedTables();
				tables.$mainBody.off('scroll.' + ns + 'H').on('scroll.' + ns + 'H', function() {
					tables.$mainHeader.scrollLeft(tables.$mainBody.scrollLeft());
					if (typeof window[syncHandlesKey] === 'function') {
						window[syncHandlesKey]();
					}
				});
			}

			function initHeaderResize() {
				var tables = getFixedTables();
				var $mainHeader = tables.$mainHeader;
				var $headTable = tables.$headTable;
				if (!$mainHeader.length || !$headTable.length) {
					return;
				}
				$mainHeader.find('.rc-handle-container').remove();
				var $handleContainer = $('<div class="rc-handle-container"></div>');
				$headTable.before($handleContainer);

				function syncResizeHandles() {
					var $ths = $headTable.find('thead tr:first th');
					if (!$ths.length) {
						return;
					}
					var tableW = $headTable.outerWidth() || 0;
					var headerH = $headTable.find('thead').outerHeight() || 40;
					$handleContainer.css({ width: tableW + 'px' });
					$handleContainer.empty();
					var containerLeft = $handleContainer.offset().left;
					$ths.each(function() {
						var $th = $(this);
						var field = $th.attr('data-field');
						if (!field || skipFields[field] || $th.hasClass('bs-checkbox')) {
							return;
						}
						var left = $th.offset().left - containerLeft + $th.outerWidth();
						$('<div class="rc-handle" title="拖动调整列宽"></div>')
							.css({ left: left + 'px', height: headerH + 'px' })
							.attr('data-field', field)
							.appendTo($handleContainer);
					});
				}

				$handleContainer.off('.' + ns + 'Resize').on('mousedown.' + ns + 'Resize', '.rc-handle', function(e) {
					e.preventDefault();
					e.stopPropagation();
					var field = $(this).attr('data-field');
					if (!field || skipFields[field]) {
						return;
					}
					var startX = e.clientX;
					var startW = colWidths[field] || 80;
					var $th = $headTable.find('thead tr:first th[data-field="' + field + '"]');
					if ($th.length) {
						startW = Math.ceil($th.outerWidth()) || startW;
					}
					var $active = $(this).addClass('rc-handle-active');
					resizing = true;
					$(document.body).css('cursor', 'col-resize');

					function onMove(ev) {
						var nextW = Math.max(48, startW + (ev.clientX - startX));
						colWidths[field] = nextW;
						applyFromHeader();
						syncResizeHandles();
						$handleContainer.find('.rc-handle[data-field="' + field + '"]').addClass('rc-handle-active');
					}

					function onUp() {
						$(document).off('mousemove.' + ns + 'Resize mouseup.' + ns + 'Resize');
						$(document.body).css('cursor', '');
						$active.removeClass('rc-handle-active');
						applyFromHeader();
						syncResizeHandles();
						fixHeaderAlign();
						resizing = false;
					}

					$(document).on('mousemove.' + ns + 'Resize', onMove);
					$(document).on('mouseup.' + ns + 'Resize', onUp);
				});

				syncResizeHandles();
				window[syncHandlesKey] = syncResizeHandles;
			}

			function refresh() {
				if (resizing) {
					return;
				}
				fixHeaderAlign();
				applyFromHeader();
				requestAnimationFrame(function() {
					applyFromHeader();
				});
				bindHScroll();
				initHeaderResize();
			}

			return { refresh: refresh };
		}

		function syncLeftSupplierOnSearch() {
			var keyword = getSupplierSearchKeyword();
			var filtered = filterSuppliersByKeyword(allSuppliers, keyword);
			updateSupplierTable(filtered);
			if (keyword) {
				selectedSupplierId = filtered.length > 0 ? filtered[0].supplierId : null;
			}
		}

		function initLeftSupplierTable() {
			var $table = $('#bootstrap-table-supplier');
			if ($table.length === 0) {
				setTimeout(initLeftSupplierTable, 300);
				return;
			}
			var tableHeight = calculateLeftSupplierTableHeight();
			try {
				$table.bootstrapTable({
					data: [],
					pagination: false,
					search: false,
					showRefresh: false,
					showColumns: false,
					showToggle: false,
					height: tableHeight,
					striped: true,
					classes: 'table table-condensed',
					locale: 'zh-CN',
					showHeader: true,
					showEmptyRows: false,
					columns: [{
						field: 'serialNumber',
						title: '序号',
						align: 'center',
						width: 50,
						cellStyle: {fontSize: '12px', padding: '4px'},
						formatter: function(value, row, index) {
							return index + 1;
						}
					},
					{
						field: 'supplierCode',
						title: '编码',
						sortable: true,
						width: 80,
						cellStyle: {fontSize: '12px', padding: '4px'},
						formatter: function(value) { return value || '-'; }
					},
					{
						field: 'companyName',
						title: '供应商名称',
						cellStyle: {fontSize: '12px', padding: '4px'},
						formatter: function(value, row) {
							if (!value) return '-';
							var name = value.length > 15 ? value.substring(0, 15) + '...' : value;
							var supplierId = row.supplierId || '';
							return '<a href="javascript:void(0)" onclick="selectSupplier(\'' + supplierId + '\')" title="' + value + '" style="font-size: 12px; cursor: pointer;">' + name + '</a>';
						}
					}],
					onClickRow: function(row) {
						if (row.supplierId) {
							selectSupplier(row.supplierId);
						}
					},
					rowStyle: function(row) {
						if (selectedSupplierId && row.supplierId == selectedSupplierId) {
							return {classes: 'info'};
						}
						return {};
					}
				});
				querySupplierList();
			} catch (e) {
				console.error("初始化供应商表格失败:", e);
			}
		}

		function querySupplierList() {
			$.ajax({
				url: supplierPrefix + "/all",
				type: "GET",
				dataType: "json",
				cache: false,
				success: function(result) {
					if (result && result.code == 0) {
						allSuppliers = result.data || [];
						applyLeftSupplierFilter();
					} else {
						allSuppliers = [];
						updateSupplierTable([]);
					}
				},
				error: function() {
					allSuppliers = [];
					updateSupplierTable([]);
				}
			});
		}

		function updateSupplierTable(suppliers) {
			var $table = $('#bootstrap-table-supplier');
			if ($table.length === 0) {
				setTimeout(function() { updateSupplierTable(suppliers); }, 300);
				return;
			}
			try {
				if ($table.bootstrapTable('getOptions')) {
					$table.bootstrapTable('load', suppliers || []);
					setTimeout(function() {
						if (selectedSupplierId) {
							$table.find('tbody tr').each(function() {
								var rowData = $table.bootstrapTable('getData');
								var rowIndex = $(this).index();
								if (rowIndex >= 0 && rowIndex < rowData.length && rowData[rowIndex].supplierId == selectedSupplierId) {
									$(this).addClass('info');
								}
							});
						}
					}, 100);
				} else {
					initLeftSupplierTable();
				}
			} catch (e) {
				console.error("更新供应商表格失败:", e);
			}
		}

		function selectSupplier(supplierId) {
			if (!supplierId) {
				selectedSupplierId = null;
				applyLeftSupplierFilter();
				loadCertDetailRows(null);
				$('#' + auditTableId).bootstrapTable('refresh');
				return;
			}
			selectedSupplierId = supplierId;
			applyLeftSupplierFilter();
			loadCertDetailRows(null);
			$('#' + auditTableId).bootstrapTable('refresh');
		}

		function isProductAudited(row) {
			return row && row.auditStatus == '1';
		}

		function auditCertificate() {
			var $table = $('#' + auditTableId);
			if ($table.length === 0) {
				$.modal.alertError("表格未初始化");
				return;
			}
			var selections = $table.bootstrapTable('getSelections');
			if (!selections || selections.length === 0) {
				var checkedRows = $table.find('tbody input[type="checkbox"]:checked').closest('tr');
				if (checkedRows.length > 0) {
					var allData = $table.bootstrapTable('getData');
					var checkedIndexes = [];
					checkedRows.each(function() {
						var index = $(this).data('index');
						if (index !== undefined) {
							checkedIndexes.push(index);
						}
					});
					if (checkedIndexes.length > 0) {
						selections = allData.filter(function(row, idx) {
							return checkedIndexes.indexOf(idx) !== -1;
						});
					}
				}
			}
			if (!selections || selections.length === 0) {
				$.modal.alertWarning("请选择一条记录");
				return;
			}
			if (selections.length > 1) {
				$.modal.alertWarning("请只选择一条记录");
				return;
			}
			var row = selections[0];
			if (!row.certificateId) {
				$.modal.alertError("无法获取证件ID");
				return;
			}
			if (isProductAudited(row)) {
				$.modal.msgWarning('该产品已审核，不能重复审核');
				return;
			}
			showAuditDialog(row.certificateId, row);
		}

		function showAuditDialog(certificateId, row) {
			var materialName = (row && row.materialName) ? row.materialName : '未知产品';
			var dialogHtml = '<div style="padding: 20px;">'
				+ '<div class="form-group"><label>产品名称：</label>'
				+ '<input type="text" class="form-control" value="' + materialName.replace(/"/g, '&quot;') + '" readonly style="margin-bottom: 10px;"></div>'
				+ '<div class="form-group"><label>审核状态：<span style="color: red;">*</span></label>'
				+ '<select id="audit-status-select" class="form-control" style="margin-bottom: 10px;">'
				+ '<option value="1">已审核</option><option value="2">已拒绝</option></select></div>'
				+ '<div class="form-group"><label>审核备注：</label>'
				+ '<textarea id="audit-remark-textarea" class="form-control" rows="3" placeholder="请输入审核备注（可选）" maxlength="500"></textarea></div>'
				+ '</div>';
			layer.open({
				type: 1,
				title: '审核产品证件',
				area: ['500px', '350px'],
				content: dialogHtml,
				btn: ['确定', '取消'],
				yes: function(index) {
					var auditStatus = $('#audit-status-select').val();
					var auditRemark = $('#audit-remark-textarea').val();
					if (!auditStatus) {
						$.modal.alertWarning("请选择审核状态");
						return false;
					}
					doAudit(certificateId, auditStatus, auditRemark, index);
				},
				btn2: function(index) {
					layer.close(index);
				}
			});
		}

		function doAudit(certificateId, auditStatus, auditRemark, layerIndex) {
			$.ajax({
				url: prefix + "/audit",
				type: "POST",
				data: {
					certificateId: certificateId,
					auditStatus: auditStatus,
					auditRemark: auditRemark || ''
				},
				success: function(result) {
					if (result.code == 0) {
						if (layerIndex !== undefined) {
							layer.close(layerIndex);
						}
						$.modal.msgSuccess("审核成功");
						setTimeout(function() {
							$('#' + auditTableId).bootstrapTable('refresh');
						}, 300);
					} else {
						$.modal.alertError(result.msg || "审核失败");
					}
				},
				error: function(xhr) {
					var errorMsg = "审核失败";
					if (xhr.responseJSON && xhr.responseJSON.msg) {
						errorMsg = xhr.responseJSON.msg;
					}
					$.modal.alertError(errorMsg);
				}
			});
		}

		function updateToolbarState() {
			var $table = $('#' + auditTableId);
			if ($table.length === 0) {
				return;
			}
			var selections = $table.bootstrapTable('getSelections');
			if (!selections || selections.length === 0) {
				var checkedCount = $table.find('tbody input[type="checkbox"]:checked').length;
				if (checkedCount === 1) {
					var allData = $table.bootstrapTable('getData');
					var checkedIndex = $table.find('tbody input[type="checkbox"]:checked').closest('tr').first().data('index');
					if (checkedIndex !== undefined && allData[checkedIndex]) {
						selections = [allData[checkedIndex]];
					}
				}
			}
			var $auditBtn = $('#toolbar .btn-product-audit');
			if (selections && selections.length === 1) {
				if (isProductAudited(selections[0])) {
					$auditBtn.addClass('disabled').prop('disabled', true);
				} else {
					$auditBtn.removeClass('disabled').prop('disabled', false);
				}
			} else {
				$auditBtn.addClass('disabled').prop('disabled', true);
			}
		}
	</script>
</body>
</html>
