<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改用户')" />
	<th:block th:include="include :: select2-css" />
	<style>
		.form-header-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin: 8px 10px 12px;
			padding-bottom: 5px;
			border-bottom: 1px solid #ddd;
		}
		.form-header-row .form-header {
			margin: 0;
			padding-bottom: 0;
			border-bottom: none;
		}
		.form-header-actions {
			flex-shrink: 0;
		}
		.user-form-grid {
			margin: 0 10px 8px;
		}
		.user-form-grid .user-inline-field {
			display: flex;
			align-items: center;
			margin-bottom: 10px;
		}
		.user-form-grid .user-inline-field > label {
			flex-shrink: 0;
			width: 96px;
			text-align: right;
			margin: 0 8px 0 0;
			font-size: 12px;
			font-weight: normal;
			color: #666;
			white-space: nowrap;
		}
		.user-form-grid .user-inline-field > label.label-wide {
			width: 112px;
		}
		.user-form-grid .user-inline-field > .form-control,
		.user-form-grid .user-inline-field > select.form-control,
		.user-form-grid .user-inline-field > .input-group,
		.user-form-grid .user-inline-field > .select2-container,
		.user-form-grid .user-inline-field > .toggle-switch,
		.user-form-grid .user-inline-field > .user-static-text,
		.user-form-grid .user-inline-field > textarea.form-control,
		.user-other-section .user-inline-field > .form-control,
		.user-other-section .user-inline-field > textarea.form-control {
			flex: 1;
			min-width: 0;
		}
		.user-form-grid .user-inline-field > .form-control,
		.user-form-grid .user-inline-field > select.form-control {
			height: 32px;
			padding: 4px 8px;
			font-size: 12px;
		}
		.user-form-grid .user-inline-field > .input-group .form-control {
			height: 32px;
			padding: 4px 8px;
			font-size: 12px;
		}
		.user-form-grid .user-inline-field > .user-static-text {
			margin: 0;
			font-size: 12px;
			line-height: 32px;
			color: #666;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.user-form-grid .user-inline-field > .user-hospital-text {
			margin: 0;
			flex: 1;
			min-width: 0;
			height: 32px;
			line-height: 32px;
			padding: 0 8px;
			font-size: 12px;
			font-weight: normal;
			color: #555;
			background-color: #fff;
			border: 1px solid #e5e6e7;
			border-radius: 4px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			box-sizing: border-box;
		}
		.user-form-grid .user-inline-field > .help-block {
			flex: 1;
			min-width: 0;
			margin: 0;
			padding: 0;
			font-size: 12px;
			line-height: 1.4;
		}
		.user-form-grid .user-inline-field.user-role-field > label {
			width: 96px;
		}
		.user-form-grid .select2-container .select2-selection--multiple {
			min-height: 32px;
		}
		.maintain-supplier-wrap { position: relative; flex: 1; min-width: 0; }
		#maintainSupplierSuggestPanel {
			position: absolute; left: 0; right: 0; top: 100%; z-index: 2000;
			max-height: 220px; overflow-y: auto; display: none;
			border: 1px solid #ddd; background: #fff; margin-top: 2px;
			box-shadow: 0 2px 6px rgba(0,0,0,.12);
		}
		#maintainSupplierSuggestPanel .list-group-item { cursor: pointer; padding: 6px 10px; border: 0; border-bottom: 1px solid #eee; }
		#maintainSupplierSuggestPanel .list-group-item:hover { background: #f5f5f5; }
		.field-muted { background-color: #eee !important; cursor: not-allowed !important; color: #888 !important; }
		#rolePickerModal .fixed-table-toolbar { display: none; }
		#rolePickerModal .bootstrap-table .table { margin-bottom: 0; }
		.user-other-section {
			margin: 16px 10px 8px;
		}
		.user-other-section .form-header.h4 {
			margin: 0 0 10px;
			padding-bottom: 5px;
			border-bottom: 1px solid #ddd;
		}
		.user-other-section .user-inline-field {
			display: flex;
			align-items: flex-start;
			margin-bottom: 10px;
		}
		.user-other-section .user-inline-field > label {
			flex-shrink: 0;
			width: 96px;
			text-align: right;
			margin: 6px 8px 0 0;
			font-size: 12px;
			font-weight: normal;
			color: #666;
			white-space: nowrap;
		}
	</style>
</head>
<body>
    <div class="main-content">
        <form class="form-horizontal" id="form-user-edit" th:object="${user}">
            <input name="userId"  type="hidden"  th:field="*{userId}" />
			<input name="deptId"  type="hidden"  th:field="*{deptId}" id="treeId"/>

            <div class="form-header-row">
                <h4 class="form-header h4">基本信息</h4>
                <div class="form-header-actions">
                    <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
                    <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭</button>
                </div>
            </div>

            <div class="user-form-grid">
                <input name="userName" type="hidden" th:field="*{userName}"/>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>医院</label>
                            <input type="hidden" name="maintainHospitalId" id="maintainHospitalId" th:value="*{maintainHospitalId}"/>
                            <p id="boundHospitalNames" class="user-hospital-text"
                               th:title="${boundHospitalNames}"
                               th:text="${#strings.isEmpty(boundHospitalNames) ? '—' : boundHospitalNames}">—</p>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>供应商</label>
                            <div class="maintain-supplier-wrap">
                                <input type="hidden" name="maintainSupplierId" id="maintainSupplierId" th:value="*{maintainSupplierId}"/>
                                <input type="text" class="form-control" id="maintainSupplierSearch" placeholder="输入公司名称关键字，点选候选项" autocomplete="off"/>
                                <div id="maintainSupplierSuggestPanel" class="list-group"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label class="is-required">登录账号</label>
                            <input class="form-control" type="text" readonly="true" th:field="*{loginName}"/>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>姓名</label>
                            <input name="realName" placeholder="票据、报表展示用，空则显示登录账号" class="form-control" type="text" maxlength="50" th:field="*{realName}">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>手机号码</label>
                            <div class="input-group">
                                <input name="phonenumber" placeholder="请输入手机号码" class="form-control" type="text" maxlength="11" th:field="*{phonenumber}">
                                <span class="input-group-addon"><i class="fa fa-mobile"></i></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>邮箱</label>
                            <div class="input-group">
                                <input name="email" class="form-control email" type="text" maxlength="50" placeholder="请输入邮箱" th:field="*{email}">
                                <span class="input-group-addon"><i class="fa fa-envelope"></i></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>用户性别</label>
                            <select name="sex" class="form-control m-b" th:with="type=${@dict.getType('sys_user_sex')}">
				                <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{sex}"></option>
				            </select>
                        </div>
                    </div>
                    <div class="col-sm-3"></div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>省份/直辖市</label>
                            <select id="selProvince" class="form-control" title="数据来自部门管理">
                                <option value="">请选择省份/直辖市</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>城市</label>
                            <select id="selCity" class="form-control">
                                <option value="">请选择城市</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>区县</label>
                            <select id="selDistrict" class="form-control">
                                <option value="">请选择区县</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-3"></div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <div class="user-inline-field">
                            <label>详细地址</label>
                            <textarea name="address" class="form-control" rows="2" maxlength="500"
                                      placeholder="选填，500字以内" style="height:auto;min-height:48px;"
                                      th:field="*{address}"></textarea>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label class="label-wide">登记明文密码</label>
                            <p class="user-static-text"
                               th:title="${#strings.isEmpty(user.pwdPlain) ? '（无记录：历史用户或未通过本系统登记/用户已自行修改密码）' : user.pwdPlain}"
                               th:text="${#strings.isEmpty(user.pwdPlain) ? '（无记录）' : user.pwdPlain}"></p>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>用户类型</label>
                            <select name="userType" id="userType" class="form-control" th:field="*{userType}">
                                <option value="">未设置（兼容历史）</option>
                                <option value="platform">平台</option>
                                <option value="hospital">医院</option>
                                <option value="supplier">供应商</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>岗位</label>
                            <select id="post" class="form-control select2-multiple" multiple>
								<option th:each="post:${posts}" th:value="${post.postId}" th:text="${post.postName}" th:selected="${post.flag}" th:disabled="${post.status == '1'}"></option>
							</select>
                        </div>
                    </div>
                    <div class="col-sm-3"></div>
                </div>
                <div class="row">
                    <div class="col-sm-6">
                        <div class="user-inline-field user-role-field">
                            <label class="is-required">用户角色</label>
                            <div style="flex:1;min-width:0;">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="pickedRoleDisplay" readonly placeholder="请选择用户角色"/>
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-default" onclick="openRolePicker()"><i class="fa fa-search"></i> 选择角色</button>
                                    </span>
                                </div>
                                <input type="hidden" id="pickedRoleId"/>
                                <input type="hidden" id="pickedRoleKey"/>
                                <input type="hidden" id="pickedRoleName"/>
                                <input type="hidden" id="pickedRoleType"/>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>用户状态</label>
                            <label class="toggle-switch switch-solid">
	                            <input type="checkbox" id="status" th:checked="${user.status == '0' ? true : false}">
	                            <span></span>
	                        </label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="user-inline-field">
                            <label>账号锁定</label>
                            <select name="accountLock" id="accountLock" class="form-control" title="密码连续错误达到上限后锁定，约10分钟自动解锁，也可手工改为未锁定">
                                <option value="0" th:selected="${accountLocked == null or !accountLocked}">未锁定</option>
                                <option value="1" th:selected="${accountLocked != null and accountLocked}">已锁定</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="user-other-section">
                <h4 class="form-header h4">其他信息</h4>
                <div class="row">
                    <div class="col-sm-12">
                        <div class="user-inline-field">
                            <label>备注</label>
                            <textarea name="remark" maxlength="500" class="form-control" rows="3" style="height:auto;min-height:72px;">[[*{remark}]]</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal fade" id="rolePickerModal" tabindex="-1" data-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">选择角色</h4>
                </div>
                <div class="modal-body">
                    <div class="row" style="margin-bottom:10px;">
                        <div class="col-sm-4">
                            <label class="control-label">角色名称</label>
                            <input type="text" class="form-control" id="rpc_roleName" placeholder="角色名称或首拼"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="control-label">医院名称</label>
                            <input type="text" class="form-control" id="rpc_hospitalName" placeholder="医院名称或首拼"/>
                        </div>
                        <div class="col-sm-4">
                            <label class="control-label">供应商名称</label>
                            <input type="text" class="form-control" id="rpc_supplierName" placeholder="供应商名称或首拼"/>
                        </div>
                    </div>
                    <p>
                        <a class="btn btn-primary btn-sm" onclick="rolePickerSearch()"><i class="fa fa-search"></i> 查询</a>
                        <a class="btn btn-warning btn-sm" onclick="rolePickerReset()"><i class="fa fa-refresh"></i> 重置</a>
                    </p>
                    <table id="rolePickerTable"></table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: select2-js" />
	<script type="text/javascript" th:inline="javascript">
        var prefix = ctx + "system/user";
        var maintainSupplierLabel = /*[[${maintainSupplierLabel}]]*/ '';
        var currentProvince = /*[[${regionProvince}]]*/ '';
        var currentCity = /*[[${regionCity}]]*/ '';
        var currentDistrict = /*[[${regionDistrict}]]*/ '';

        var rolePickerTableInited = false;
        var rolePickerRowCache = {};

        function roleKeyFromSelect() {
            return $.common.trim($('#pickedRoleKey').val() || '');
        }
        function roleNameFromSelect() {
            return $.common.trim($('#pickedRoleName').val() || '');
        }
        function roleTypeFromSelect() {
            return $.common.trim($('#pickedRoleType').val() || '');
        }
        function pickerRoleTypeText(t) {
            if (!t) return '未标注';
            if (t === 'platform') return '平台';
            if (t === 'hospital') return '医院';
            if (t === 'supplier') return '供应商';
            return t;
        }
        function pickerRoleTypeHtml(t) {
            if (!t) return '<span class="text-muted">—</span>';
            if (t === 'platform') return '<span class="label label-default">平台</span>';
            if (t === 'hospital') return '<span class="label label-info">医院</span>';
            if (t === 'supplier') return '<span class="label label-primary">供应商</span>';
            return t;
        }

        function openRolePicker() {
            $('#rolePickerModal').modal('show');
            if (!rolePickerTableInited) {
                initRolePickerTable();
                rolePickerTableInited = true;
            } else {
                $('#rolePickerTable').bootstrapTable('refresh');
            }
        }

        function rolePickerSearch() {
            if (rolePickerTableInited) {
                $('#rolePickerTable').bootstrapTable('refresh', { pageNumber: 1 });
            }
        }

        function rolePickerReset() {
            $('#rpc_roleName').val('');
            $('#rpc_hospitalName').val('');
            $('#rpc_supplierName').val('');
            rolePickerSearch();
        }

        function initRolePickerTable() {
            $('#rolePickerTable').bootstrapTable({
                url: prefix + '/rolePicker/list',
                method: 'post',
                contentType: 'application/x-www-form-urlencoded; charset=UTF-8',
                striped: true,
                sidePagination: 'server',
                pagination: true,
                pageSize: 10,
                pageList: [10, 25, 50],
                height: 360,
                queryParams: function (params) {
                    return {
                        pageNum: params.offset / params.limit + 1,
                        pageSize: params.limit,
                        roleName: $('#rpc_roleName').val(),
                        pickerHospitalName: $('#rpc_hospitalName').val(),
                        pickerSupplierName: $('#rpc_supplierName').val()
                    };
                },
                responseHandler: function (res) {
                    if (res.code === web_status.SUCCESS) {
                        rolePickerRowCache = {};
                        $.each(res.rows || [], function (i, r) {
                            if (r && r.roleId != null) {
                                rolePickerRowCache[r.roleId] = r;
                            }
                        });
                        return { rows: res.rows, total: res.total };
                    }
                    $.modal.alertWarning(res.msg || '加载失败');
                    return { rows: [], total: 0 };
                },
                columns: [
                    { field: 'roleId', title: '编号', width: 70 },
                    { field: 'hospitalId', visible: false },
                    { field: 'supplierId', visible: false },
                    { field: 'roleName', title: '角色名称', sortable: true },
                    { field: 'roleKey', title: '权限字符' },
                    { field: 'pinyinCode', title: '首拼简码', formatter: function (v) { return v || '—'; } },
                    {
                        field: 'roleType',
                        title: '角色类型',
                        width: 88,
                        formatter: function (v) { return pickerRoleTypeHtml(v); }
                    },
                    {
                        field: 'orgAdmin',
                        title: '机构管理员',
                        width: 88,
                        formatter: function (v) {
                            return (v === '1' || v === 1) ? '<span class="label label-warning">是</span>' : '<span class="text-muted">否</span>';
                        }
                    },
                    {
                        field: 'hospitalName',
                        title: '绑定医院',
                        formatter: function (v) { return v || '—'; }
                    },
                    {
                        field: 'supplierCompanyName',
                        title: '绑定供应商',
                        formatter: function (v) { return v || '—'; }
                    },
                    {
                        title: '操作',
                        align: 'center',
                        formatter: function (value, row, index) {
                            return '<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="applyPickedRoleById(' + row.roleId + ')"><i class="fa fa-check"></i> 选择</a>';
                        }
                    }
                ]
            });
        }

        function applyPickedRoleById(roleId) {
            var row = rolePickerRowCache[roleId];
            if (!row) {
                var rows = $('#rolePickerTable').bootstrapTable('getData') || [];
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i] && String(rows[i].roleId) === String(roleId)) {
                        row = rows[i];
                        break;
                    }
                }
            }
            if (!row) {
                return;
            }
            var category = resolveRoleCategory(row);
            $('#pickedRoleId').val(row.roleId);
            $('#pickedRoleKey').val(row.roleKey || '');
            $('#pickedRoleName').val(row.roleName || '');
            $('#pickedRoleType').val(category || row.roleType || '');
            $('#pickedRoleDisplay').val(row.roleName || '');
            applyFieldsFromPickedRole(row, category);
            $('#rolePickerModal').modal('hide');
        }
        function resolveRoleCategory(row) {
            var rt = $.common.trim((row && row.roleType) || roleTypeFromSelect() || '');
            if (rt === 'hospital' || rt === 'supplier' || rt === 'platform') {
                return rt;
            }
            var k = $.common.trim((row && row.roleKey) || roleKeyFromSelect() || '');
            var n = $.common.trim((row && row.roleName) || roleNameFromSelect() || '');
            if (k === 'hospital_admin' || n === '医院' || n.indexOf('医院') >= 0) {
                return 'hospital';
            }
            if (k === 'supplier' || k === 'supplier_admin' || k === 'supplier_sales' || n === '供应商' || n.indexOf('供应商') >= 0) {
                return 'supplier';
            }
            return '';
        }
        function setBoundHospitalNames(text) {
            var s = $.common.trim(text || '');
            if (!s) {
                s = '—';
            }
            $('#boundHospitalNames').text(s).attr('title', s === '—' ? '' : s);
        }
        function refreshBoundHospitalNames(supplierId, hospitalId) {
            var sid = supplierId != null && supplierId !== '' ? supplierId : $.common.trim($('#maintainSupplierId').val() || '');
            var hid = hospitalId != null && hospitalId !== '' ? hospitalId : $.common.trim($('#maintainHospitalId').val() || '');
            if (!sid && !hid) {
                setBoundHospitalNames('');
                return;
            }
            var params = {};
            if (sid) {
                params.supplierId = sid;
            }
            if (hid) {
                params.hospitalId = hid;
            }
            $.get(prefix + '/boundHospitals', params, function (res) {
                if (res.code === 0 || res.code === web_status.SUCCESS) {
                    var text = res.data;
                    if (text == null || text === '') {
                        text = res.msg && res.msg !== '操作成功' ? res.msg : '';
                    }
                    if (text) {
                        setBoundHospitalNames(text);
                    }
                }
            });
        }
        function applyUserTypeByRoleType(roleType) {
            if (roleType === 'hospital' || roleType === 'supplier' || roleType === 'platform') {
                $('#userType').val(roleType).trigger('change');
            }
        }
        function applyFieldsFromPickedRole(row, category) {
            if (!row) {
                return;
            }
            category = category || resolveRoleCategory(row);
            applyUserTypeByRoleType(category);
            applyMaintainFieldsByRole(row, category);
        }
        function isHospitalPrincipalRole() {
            return resolveRoleCategory({}) === 'hospital';
        }
        function isSupplierPrincipalRole() {
            var rt = roleTypeFromSelect();
            if (rt === 'supplier') return true;
            if (rt === 'hospital' || rt === 'platform') return false;
            var k = roleKeyFromSelect();
            var n = roleNameFromSelect();
            if (!k && !n) return false;
            if (k === 'supplier' || k === 'supplier_admin' || k === 'supplier_sales'
                || k === 'tp_supplier_admin' || k === 'tp_supplier_sales') return true;
            if (n === '供应商') return true;
            return n.indexOf('供应商') >= 0;
        }
        function applyMaintainFieldsByRole(roleRow, category) {
            category = category || resolveRoleCategory(roleRow || {});
            var $h = $('#maintainHospitalId');
            var $sid = $('#maintainSupplierId');
            var $st = $('#maintainSupplierSearch');
            var $wrap = $('.maintain-supplier-wrap');
            if (category === 'hospital') {
                $sid.val('').prop('disabled', true);
                $st.val('').prop('disabled', true).addClass('field-muted');
                $wrap.addClass('field-muted');
                $('#maintainSupplierSuggestPanel').hide().empty();
                if (roleRow && roleRow.hospitalId) {
                    $h.val(String(roleRow.hospitalId));
                    setBoundHospitalNames(roleRow.hospitalName || '');
                } else if ($.common.trim($h.val())) {
                    refreshBoundHospitalNames('', $h.val());
                } else {
                    setBoundHospitalNames('');
                }
            } else if (category === 'supplier') {
                $h.val('');
                $sid.prop('disabled', false);
                $st.prop('disabled', false).removeClass('field-muted');
                $wrap.removeClass('field-muted');
                if (roleRow && roleRow.supplierId) {
                    $sid.val(String(roleRow.supplierId));
                    $st.val(roleRow.supplierCompanyName || '');
                }
                refreshBoundHospitalNames($sid.val(), '');
            } else {
                $h.val('');
                $sid.val('').prop('disabled', true);
                $st.val('').prop('disabled', true).addClass('field-muted');
                $wrap.addClass('field-muted');
                $('#maintainSupplierSuggestPanel').hide().empty();
                setBoundHospitalNames('');
            }
        }

        function fillRegionSelect($sel, list, firstLabel) {
            $sel.empty();
            $sel.append($('<option></option>').attr('value', '').text(firstLabel));
            $.each(list || [], function(_, o) {
                var id = o.deptId != null ? o.deptId : o.dept_id;
                var nm = o.deptName != null ? o.deptName : o.dept_name;
                $sel.append($('<option></option>').attr('value', nm).text(nm).attr('data-dept-id', id));
            });
        }

        function loadRegionChildren(parentId, $sel, firstLabel, callback) {
            if (!parentId) {
                fillRegionSelect($sel, [], firstLabel);
                if (callback) {
                    callback();
                }
                return;
            }
            $.get(prefix + '/deptRegionOptions', { parentId: parentId }, function(res) {
                if (res && (res.code === 0 || res.code === web_status.SUCCESS)) {
                    fillRegionSelect($sel, res.data, firstLabel);
                } else {
                    fillRegionSelect($sel, [], firstLabel);
                }
                if (callback) {
                    callback();
                }
            });
        }

        function selectRegionByName($sel, name) {
            if (!name) {
                return null;
            }
            var deptId = null;
            $sel.find('option').each(function() {
                if ($(this).val() === name) {
                    $sel.val(name);
                    deptId = $(this).attr('data-dept-id');
                    return false;
                }
            });
            return deptId;
        }

        function loadRegionProvinces(callback) {
            $.get(prefix + '/deptRegionOptions', function(res) {
                if (res && (res.code === 0 || res.code === web_status.SUCCESS)) {
                    fillRegionSelect($('#selProvince'), res.data, '请选择省份/直辖市');
                }
                if (callback) {
                    callback();
                }
            });
        }

        function syncTreeIdFromRegion() {
            var distId = $('#selDistrict option:selected').attr('data-dept-id');
            var cityId = $('#selCity option:selected').attr('data-dept-id');
            var provId = $('#selProvince option:selected').attr('data-dept-id');
            var deepest = distId || cityId || provId || '';
            $('#treeId').val(deepest);
        }

        function bindDeptRegionChangeHandlers() {
            $('#selProvince').off('change.deptRegion').on('change.deptRegion', function() {
                var pid = $(this).find('option:selected').attr('data-dept-id');
                fillRegionSelect($('#selCity'), [], '请选择城市');
                fillRegionSelect($('#selDistrict'), [], '请选择区县');
                syncTreeIdFromRegion();
                if (pid) {
                    loadRegionChildren(Number(pid), $('#selCity'), '请选择城市');
                }
            });
            $('#selCity').off('change.deptRegion').on('change.deptRegion', function() {
                var pid = $(this).find('option:selected').attr('data-dept-id');
                fillRegionSelect($('#selDistrict'), [], '请选择区县');
                syncTreeIdFromRegion();
                if (pid) {
                    loadRegionChildren(Number(pid), $('#selDistrict'), '请选择区县');
                }
            });
            $('#selDistrict').off('change.deptRegion').on('change.deptRegion', function() {
                syncTreeIdFromRegion();
            });
        }

        function restoreSavedRegion() {
            loadRegionProvinces(function() {
                var provId = selectRegionByName($('#selProvince'), currentProvince);
                if (!provId) {
                    syncTreeIdFromRegion();
                    return;
                }
                loadRegionChildren(Number(provId), $('#selCity'), '请选择城市', function() {
                    if (!currentCity) {
                        syncTreeIdFromRegion();
                        return;
                    }
                    var cityId = selectRegionByName($('#selCity'), currentCity);
                    if (!cityId) {
                        syncTreeIdFromRegion();
                        return;
                    }
                    loadRegionChildren(Number(cityId), $('#selDistrict'), '请选择区县', function() {
                        if (currentDistrict) {
                            selectRegionByName($('#selDistrict'), currentDistrict);
                        }
                        syncTreeIdFromRegion();
                    });
                });
            });
        }
        
        $("#form-user-edit").validate({
        	onkeyup: false,
        	rules:{
        		email:{
                    email:true,
                    remote: {
                        url: prefix + "/checkEmailUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                        	"userId": function() {
                                return $("#userId").val();
                            },
                			"email": function() {
                                return $.common.trim($("#email").val());
                            }
                        }
                    }
        		},
        		phonenumber:{
        			isPhone:true,
                    remote: {
                        url: prefix + "/checkPhoneUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                        	"userId": function() {
                        		return $("#userId").val();
                            },
                			"phonenumber": function() {
                                return $.common.trim($("#phonenumber").val());
                            }
                        }
                    }
        		},
        	},
        	messages: {
        		"email": {
                    remote: "Email已经存在"
                },
        		"phonenumber":{
                	remote: "手机号码已经存在"
        		}
            },
            focusCleanup: true
        });
        
        function submitHandler() {
            var roleId = $.common.trim($("#pickedRoleId").val());
            if (!roleId) {
                $.modal.msgWarning("请选择角色");
                return;
            }
            if (isHospitalPrincipalRole() && !$.common.trim($("#maintainHospitalId").val())) {
                $.modal.msgWarning("当前角色需要维护医院，请先选择带医院绑定的角色");
                return;
            }
            if (isSupplierPrincipalRole() && !$.common.trim($("#maintainSupplierId").val())) {
                $.modal.msgWarning("当前角色需要维护供应商，请先选择“供应商”");
                return;
            }
	        if ($.validate.form()) {
	        	syncTreeIdFromRegion();
	        	var data = $("#form-user-edit").serializeArray();
	        	var status = $("input[id='status']").is(':checked') == true ? 0 : 1;
	        	var postIds = $.form.selectSelects("post");
	        	data.push({"name": "status", "value": status});
	        	data.push({"name": "roleIds", "value": roleId});
	        	data.push({"name": "postIds", "value": postIds});
	        	$.operate.saveTab(prefix + "/edit", data);
	        }
	    }

		$(function() {
            $('#post').select2({
                placeholder: "请选择岗位",
                allowClear: true
            });
            bindDeptRegionChangeHandlers();
            if (currentProvince) {
                restoreSavedRegion();
            } else {
                loadRegionProvinces();
            }
            var initRid = /*[[${pickerInitialRoleId}]]*/ null;
            if (initRid != null && initRid !== '') {
                $('#pickedRoleId').val(initRid);
                $('#pickedRoleKey').val(/*[[${pickerInitialRoleKey}]]*/ '');
                $('#pickedRoleName').val(/*[[${pickerInitialRoleName}]]*/ '');
                $('#pickedRoleType').val(/*[[${pickerInitialRoleType}]]*/ '');
                var initDisplay = /*[[${pickerInitialDisplay}]]*/ '';
                var initRoleName = /*[[${pickerInitialRoleName}]]*/ '';
                $('#pickedRoleDisplay').val(initDisplay || initRoleName || '');
            }
            if ($('#maintainSupplierId').val()) {
                $('#maintainSupplierSearch').val(maintainSupplierLabel || '');
            }
            // 先保留服务端渲染的医院名，再异步刷新（避免接口异常时被清空）
            var serverHospitalNames = /*[[${boundHospitalNames}]]*/ '';
            if (serverHospitalNames) {
                setBoundHospitalNames(serverHospitalNames);
            }
            applyMaintainFieldsByRole();
            if ($.common.trim($('#maintainSupplierId').val()) || $.common.trim($('#maintainHospitalId').val())) {
                refreshBoundHospitalNames();
            }
            var supplierTimer;
            $('#maintainSupplierSearch').on('input', function () {
                if ($('#maintainSupplierSearch').prop('disabled')) {
                    return;
                }
                clearTimeout(supplierTimer);
                var kw = $.common.trim($(this).val());
                supplierTimer = setTimeout(function () {
                    if (kw === '') {
                        $('#maintainSupplierSuggestPanel').hide().empty();
                        return;
                    }
                    $.get(prefix + '/maintainSupplierOptions', { keyword: kw }, function (res) {
                        if (res.code !== 0 || !res.data) {
                            return;
                        }
                        var $p = $('#maintainSupplierSuggestPanel').empty();
                        $.each(res.data, function (i, row) {
                            $('<a class="list-group-item"></a>')
                                .attr('href', 'javascript:void(0)')
                                .data('id', row.id)
                                .data('text', row.text)
                                .text(row.text)
                                .appendTo($p);
                        });
                        if (res.data.length) {
                            $p.show();
                        } else {
                            $p.hide();
                        }
                    });
                }, 300);
            });
            $('#maintainSupplierSuggestPanel').on('mousedown', '.list-group-item', function (e) {
                e.preventDefault();
                var $t = $(this);
                $('#maintainSupplierId').val($t.data('id'));
                $('#maintainSupplierSearch').val($t.data('text'));
                $('#maintainSupplierSuggestPanel').hide().empty();
                $('#maintainHospitalId').val('');
                refreshBoundHospitalNames($t.data('id'), '');
            });
            $(document).on('click', function (e) {
                if (!$(e.target).closest('.maintain-supplier-wrap').length) {
                    $('#maintainSupplierSuggestPanel').hide();
                }
            });
            $('#maintainSupplierSearch').on('blur', function () {
                setTimeout(function () {
                    if ($.common.trim($('#maintainSupplierSearch').val()) === '') {
                        $('#maintainSupplierId').val('');
                        if (!isHospitalPrincipalRole()) {
                            setBoundHospitalNames('');
                        }
                    }
                }, 250);
            });
        })
    </script>
