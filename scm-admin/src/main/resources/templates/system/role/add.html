<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增角色')" />
	<th:block th:include="include :: ztree-css" />
	<style>
		.role-form-page .ibox-content {
			position: relative;
			padding-top: 12px;
		}
		.role-form-page .role-form-actions {
			position: absolute;
			top: 10px;
			right: 16px;
			z-index: 2;
			margin: 0;
			white-space: nowrap;
		}
		.role-form-page .role-form-grid.basic {
			display: flex;
			flex-wrap: nowrap;
			align-items: flex-end;
			margin: 0 0 10px;
			padding-right: 140px;
			gap: 8px;
		}
		.role-form-page .role-form-grid.basic .role-field {
			flex: 1 1 0;
			min-width: 0;
			padding: 0;
			width: auto;
		}
		.role-form-page .role-form-grid.basic .role-field.field-sort {
			flex: 0 0 88px;
		}
		.role-form-page .role-form-grid.basic .role-field.field-status {
			flex: 0 0 64px;
		}
		.role-form-page .role-form-grid.extra {
			display: flex;
			flex-wrap: nowrap;
			align-items: flex-end;
			margin: 0 0 10px;
			gap: 8px;
		}
		.role-form-page .role-form-grid.extra .role-field {
			flex: 1 1 0;
			min-width: 0;
			padding: 0;
			width: auto;
		}
		.role-form-page .role-form-grid.extra .role-field.half {
			flex: 1.4 1 0;
		}
		.role-form-page .role-field > .control-label {
			display: block;
			float: none;
			width: auto;
			text-align: left;
			padding: 0 0 4px;
			margin: 0;
			line-height: 1.4;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.role-form-page .role-field > .field-body {
			width: 100%;
		}
		.role-form-page .role-menu-block {
			margin-top: 4px;
		}
		.role-form-page .role-menu-block > .control-label {
			display: block;
			float: none;
			width: auto;
			text-align: left;
			padding: 0 0 6px;
			margin: 0;
		}
	</style>
</head>
<body class="white-bg role-form-page">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<div class="role-form-actions">
			<button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
			<button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭</button>
		</div>
		<form class="form-horizontal m" id="form-role-add">
			<div class="role-form-grid basic">
				<div class="role-field">
					<label class="control-label is-required">角色名称：</label>
					<div class="field-body">
						<input class="form-control" type="text" name="roleName" id="roleName" required>
					</div>
				</div>
				<div class="role-field">
					<label class="control-label">首拼简码：</label>
					<div class="field-body">
						<input class="form-control" type="text" readonly placeholder="自动生成">
					</div>
				</div>
				<div class="role-field">
					<label class="control-label is-required">权限字符：</label>
					<div class="field-body">
						<input class="form-control" type="text" name="roleKey" id="roleKey" required title="控制器中定义的权限字符，如：@RequiresRoles(&quot;&quot;)">
					</div>
				</div>
				<div class="role-field field-sort">
					<label class="control-label is-required">显示顺序：</label>
					<div class="field-body">
						<input class="form-control" type="text" name="roleSort" id="roleSort" required>
					</div>
				</div>
				<div class="role-field field-status">
					<label class="control-label">状态：</label>
					<div class="field-body">
						<label class="toggle-switch switch-solid">
							<input type="checkbox" id="status" checked>
							<span></span>
						</label>
					</div>
				</div>
				<div class="role-field">
					<label class="control-label">备注：</label>
					<div class="field-body">
						<input id="remark" name="remark" class="form-control" type="text">
					</div>
				</div>
				<div class="role-field">
					<label class="control-label">角色类型：</label>
					<div class="field-body">
						<select name="roleType" id="roleType" class="form-control">
							<option value="platform" selected>平台</option>
							<option value="hospital">医院</option>
							<option value="supplier">供应商</option>
						</select>
					</div>
				</div>
			</div>
			<div class="role-form-grid extra">
				<div class="role-field" id="grpBindHospital" style="display:none;">
					<label class="control-label">绑定医院：</label>
					<div class="field-body">
						<select name="hospitalId" id="hospitalId" class="form-control">
							<option value="">请选择</option>
							<option th:each="h : ${hospitals}" th:value="${h.hospitalId}" th:text="${h.hospitalName}"></option>
						</select>
					</div>
				</div>
				<div class="role-field" id="grpBindSupplier" style="display:none;">
					<label class="control-label">绑定供应商：</label>
					<div class="field-body">
						<select name="supplierId" id="supplierId" class="form-control">
							<option value="">请选择</option>
							<option th:each="s : ${suppliers}" th:value="${s.supplierId}" th:text="${s.companyName}"></option>
						</select>
					</div>
				</div>
				<div class="role-field half" id="grpOrgAdmin" style="display:none;">
					<label class="control-label">机构管理员角色：</label>
					<div class="field-body">
						<select name="orgAdmin" id="orgAdmin" class="form-control">
							<option value="0" selected>否</option>
							<option value="1">是（同类型全局模板角色仅建议保留一个）</option>
						</select>
					</div>
				</div>
			</div>
			<div class="role-menu-block">
				<label class="control-label">菜单权限：</label>
				<div>
					<div id="menuDataHealthWarn" class="alert alert-warning" style="display:none; margin-bottom: 10px;"></div>
					<label class="check-box">
						<input type="checkbox" value="1">展开/折叠</label>
					<label class="check-box">
						<input type="checkbox" value="2">全选/全不选</label>
					<label class="check-box">
						<input type="checkbox" value="3" checked>父子联动</label>
					<div id="menuTrees" class="ztree ztree-border"></div>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: ztree-js" />
	<script type="text/javascript">
	    $(function() {
			var url = ctx + "system/menu/roleMenuTreeData";
			var options = {
				id: "menuTrees",
		        url: url,
		        check: { enable: true },
		        expandLevel: 0
		    };
			$.tree.init(options);
			loadInvalidMenuSummary();
			$("#roleType").on("change", syncRoleTenantUi);
			syncRoleTenantUi();
		});

		function syncRoleTenantUi() {
			var t = $("#roleType").val() || "platform";
			if (t === "hospital" || t === "supplier") {
				$("#grpBindHospital").hide();
				$("#grpBindSupplier").hide();
				$("#hospitalId").val("");
				$("#supplierId").val("");
				$("#grpOrgAdmin").show();
			} else {
				$("#grpBindHospital").hide();
				$("#grpBindSupplier").hide();
				$("#hospitalId").val("");
				$("#supplierId").val("");
				$("#orgAdmin").val("0");
				$("#grpOrgAdmin").hide();
			}
		}

		function loadInvalidMenuSummary() {
			$.get(ctx + "system/menu/invalidNameSummary", function(res) {
				var ok = res && (res.code === 0 || res.code === "0");
				if (!ok || !res.data) {
					return;
				}
				var count = Number(res.data.count || 0);
				if (count <= 0) {
					return;
				}
				var samples = (res.data.samples || []).join("，");
				var tip = "检测到 " + count + " 条菜单名称异常（空/null/undefined），已自动兜底显示。建议执行 data_integrity.sql 修复。";
				if (samples) {
					tip += " 示例：" + samples;
				}
				$("#menuDataHealthWarn").text(tip).show();
			});
		}
		
		$("#form-role-add").validate({
			rules:{
				onkeyup: false,
				roleName:{
					remote: {
		                url: ctx + "system/role/checkRoleNameUnique",
		                type: "post",
		                dataType: "json",
		                data: {
		                	"roleName" : function() {
		                		return $.common.trim($("#roleName").val());
		                    }
		                }
		            }
				},
				roleKey:{
					remote: {
		                url: ctx + "system/role/checkRoleKeyUnique",
		                type: "post",
		                dataType: "json",
		                data: {
		                	"roleKey" : function() {
		                        return $.common.trim($("#roleKey").val());
		                    }
		                }
		            }
				},
				roleSort:{
					digits:true
				},
			},
			messages: {
		        "roleName": {
		            remote: "角色名称已经存在"
		        },
		        "roleKey": {
		            remote: "角色权限已经存在"
		        }
		    },
		    focusCleanup: true
		});
		
		$('input').on('ifChanged', function(obj){
			var type = $(this).val();
			var checked = obj.currentTarget.checked;
			if (type == 1) {
			    if (checked) {
			        $._tree.expandAll(true);
			    } else {
			        $._tree.expandAll(false);
			    }
			} else if (type == "2") {
			    if (checked) {
			        $._tree.checkAllNodes(true);
			    } else {
			        $._tree.checkAllNodes(false);
			    }
			} else if (type == "3") {
			    if (checked) {
			        $._tree.setting.check.chkboxType = { "Y": "ps", "N": "ps" };
			    } else {
			        $._tree.setting.check.chkboxType = { "Y": "", "N": "" };
			    }
			}
		})
		
		function submitHandler() {
	        if ($.validate.form()) {
	        	add();
	        }
	    }
	
		function add() {
			var roleName = $("input[name='roleName']").val();
			var roleKey = $("input[name='roleKey']").val();
			var roleSort = $("input[name='roleSort']").val();
			var status = $("input[id='status']").is(':checked') == true ? 0 : 1;
			var remark = $("input[name='remark']").val();
			var menuIds = $.tree.getCheckedNodes();
			$.ajax({
				cache : true,
				type : "POST",
				url : ctx + "system/role/add",
				data : {
					"roleName": roleName,
					"roleKey": roleKey,
					"roleSort": roleSort,
					"status": status,
					"remark": remark,
					"roleType": $("#roleType").val(),
					"hospitalId": $("#hospitalId").val() || "",
					"supplierId": $("#supplierId").val() || "",
					"orgAdmin": $("#orgAdmin").val(),
					"menuIds": menuIds
				},
				async : false,
				error : function(request) {
					$.modal.alertError("系统错误");
				},
				success : function(data) {
					$.operate.successCallback(data);
				}
			});
		}
	</script>
</body>
</html>
