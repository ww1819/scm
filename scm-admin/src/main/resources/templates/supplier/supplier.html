<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('供应商列表')" />
	<th:block th:include="include :: layout-latest-css" />
	<th:block th:include="include :: bootstrap-table-fixed-columns-css" />
	<style>
		.supplier-table-wrap {
			min-height: 0;
			position: relative;
			padding-bottom: 0;
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}

		.supplier-table-wrap > .bootstrap-table {
			flex: 1 1 auto;
			min-height: 0;
		}

		.supplier-table-wrap .bootstrap-table {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding-bottom: 0;
		}

		.supplier-table-wrap .fixed-table-container {
			flex: 1 1 auto;
			min-height: 0;
			padding-bottom: 0;
		}

		.supplier-table-wrap .fixed-table-body {
			overflow-x: auto !important;
			overflow-y: auto !important;
		}

		.supplier-table-wrap.supplier-list-table .fixed-columns-right {
			z-index: 5;
			box-shadow: -4px 0 8px rgba(0, 0, 0, 0.08);
		}

		.supplier-table-wrap .fixed-table-body .fixed-table-border {
			display: none !important;
			height: 0 !important;
		}

		.supplier-table-wrap .fixed-table-pagination {
			position: relative;
			flex-shrink: 0;
			left: auto;
			right: auto;
			bottom: auto;
			background: #fff;
			z-index: 3;
			border-top: 1px solid #eee;
			margin: 0 !important;
			padding: 4px 10px 2px;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-pagination .pagination {
			margin-right: 172px;
		}

		/* 文本列表头左对齐，排序图标紧跟文字 */
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th {
			text-align: left !important;
		}
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th .th-inner,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th .sortable {
			text-align: left !important;
			justify-content: flex-start !important;
			display: inline-block !important;
			width: auto !important;
			max-width: 100%;
			box-sizing: border-box;
			vertical-align: middle;
			padding-right: 18px !important;
			background-position: right center !important;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th.bs-checkbox,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="rowIndex"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="rowIndex"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="status"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="status"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="contactPhone"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="contactPhone"] {
			text-align: center !important;
		}
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th.bs-checkbox .th-inner,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="rowIndex"] .th-inner,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="status"] .th-inner,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="contactPhone"] .th-inner {
			text-align: center !important;
			justify-content: center !important;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-header {
			position: relative;
			top: auto;
			z-index: 2;
			background: #fff;
			overflow: hidden;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header table,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body > table {
			table-layout: fixed;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body tbody td {
			box-sizing: border-box;
			vertical-align: middle;
		}

		/* 主表滚动区隐藏操作列内容，由右侧 fixed-columns-right 展示（与配送单据申请一致） */
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="supplierOperate"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="supplierOperate"] {
			padding: 0 !important;
			border-left: 0 !important;
			border-right: 0 !important;
			font-size: 0;
			line-height: 0;
			color: transparent;
			overflow: hidden;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="supplierOperate"] > *,
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="supplierOperate"] > * {
			display: none;
		}

		.supplier-table-wrap.supplier-list-table .fixed-columns-right .fixed-table-header th,
		.supplier-table-wrap.supplier-list-table .fixed-columns-right .fixed-table-body td {
			background-color: #fff;
			vertical-align: middle;
			white-space: nowrap;
		}

		.supplier-table-wrap.supplier-list-table .fixed-columns-right .fixed-table-header th[data-field="supplierOperate"] {
			background-color: #f5f5f5;
			min-width: 160px;
			width: 160px;
			text-align: center;
		}

		.supplier-table-wrap.supplier-list-table .fixed-columns-right .fixed-table-header th[data-field="supplierOperate"] .th-inner {
			text-align: center;
			justify-content: center;
		}

		.supplier-table-wrap.supplier-list-table .fixed-columns-right .fixed-table-body td[data-field="supplierOperate"] {
			min-width: 160px;
			width: 160px;
			padding: 6px 8px;
			text-align: center;
		}

		.supplier-table-wrap.supplier-list-table.table-striped .fixed-columns-right .fixed-table-body tbody tr:nth-of-type(odd) td {
			background-color: #f9f9f9;
		}

		.supplier-table-wrap.supplier-list-table .fixed-columns-right .fixed-table-body {
			overflow-x: hidden !important;
			overflow-y: hidden !important;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-body tbody td {
			white-space: nowrap;
			vertical-align: middle !important;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="companyName"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="pinyinCode"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="deliveryHospitals"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="contactPerson"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="province"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="city"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="createTime"] {
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-header th[data-field="status"],
		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="status"] {
			overflow: visible;
			text-align: center !important;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="supplierCode"] {
			white-space: nowrap;
		}

		.supplier-table-wrap.supplier-list-table .supplier-status-toggle {
			display: inline-block;
			line-height: 1;
			vertical-align: middle;
			cursor: pointer;
		}

		.supplier-table-wrap.supplier-list-table .supplier-cell-ellipsis {
			display: block;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			max-width: 100%;
		}

		.supplier-table-wrap.supplier-list-table .fixed-table-container > .fixed-table-body td[data-field="companyName"] a.supplier-cell-ellipsis {
			color: #337ab7;
		}

		/* 搜索区：与配送单据申请一致 */
		.container-div > .row > .search-collapse {
			padding-top: 10px !important;
			padding-bottom: 10px !important;
		}

		.container-div .search-collapse .select-list ul {
			margin-bottom: 0;
		}

		.container-div .search-collapse .select-list li {
			margin: 4px 15px 4px 0;
		}
	</style>
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="supplier-form">
					<div class="select-list">
						<ul>
							<li>
								供应商编码：<input type="text" name="supplierCode"/>
							</li>
							<li>
								公司名称/首拼：<input type="text" name="companyName" placeholder="名称或拼音首字母"/>
							</li>
							<li>
								状态：<select name="status">
									<option value="">所有</option>
									<option value="0">待审核</option>
									<option value="1">正常</option>
									<option value="2">停用</option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()" style="display: none;"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="resetPre()" style="display: none;"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

	        <div class="btn-group-sm" id="toolbar" role="group">
	        	<a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="supplier:supplier:add">
	                <i class="fa fa-plus"></i> 新增
	            </a>
	            <a class="btn btn-info" onclick="$.modal.openTab('新增医院关联', ctx + 'supplier/associate')" shiro:hasPermission="supplier:associate:view">
	                <i class="fa fa-link"></i> 新增关联
	            </a>
	            <a class="btn btn-default" onclick="$.modal.openTab('关联关系修改', ctx + 'supplier/associate/modify')" shiro:hasPermission="supplier:associateModify:view">
	                <i class="fa fa-pencil-square-o"></i> 关联修改
	            </a>
	             <a class="btn btn-primary single disabled" onclick="editSelectedSupplier()" shiro:hasPermission="supplier:supplier:edit">
		            <i class="fa fa-edit"></i> 修改
		        </a>
	            <a class="btn btn-info single disabled" onclick="ensureBuiltinRoles()" shiro:hasPermission="supplier:supplier:edit" title="确保全局供应商管理员/业务员角色存在并重绑用户；不会按供应商新建 sys_role。补齐后请到用户授权查看，勿仅在角色管理按公司名找「本供应商角色行」">
	                <i class="fa fa-wrench"></i> 补齐内置角色/权限
	            </a>
	            <a class="btn btn-danger multiple disabled" onclick="removeSelectedSuppliers()" shiro:hasPermission="supplier:supplier:remove">
	                <i class="fa fa-remove"></i> 删除
	            </a>
	            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="supplier:supplier:export">
		            <i class="fa fa-download"></i> 导出
		        </a>
	            <a class="btn btn-primary" onclick="$.table.search()">
		            <i class="fa fa-search"></i> 搜索
		        </a>
	            <a class="btn btn-warning" onclick="resetPre()">
		            <i class="fa fa-refresh"></i> 重置
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped supplier-table-wrap supplier-list-table">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>

	<th:block th:include="include :: footer" />
	<th:block th:include="include :: layout-latest-js" />
	<th:block th:include="include :: bootstrap-table-fixed-columns-js" />
	<script th:src="@{/js/common/tableColResize.js}"></script>
	<script th:inline="javascript">
		var editFlag = [[${@permission.hasPermi('supplier:supplier:edit')}]];
		var removeFlag = [[${@permission.hasPermi('supplier:supplier:remove')}]];
		var prefix = ctx + "supplier/supplier";
		var supplierTableId = 'bootstrap-table';

		var supplierColWidths = {
			rowIndex: 60,
			supplierCode: 150,
			companyName: 180,
			pinyinCode: 90,
			deliveryHospitals: 160,
			contactPerson: 90,
			contactPhone: 120,
			province: 80,
			city: 80,
			status: 90,
			createTime: 160,
			supplierOperate: 160
		};

		var supplierColResize = createTableColResizeController({
			tableId: supplierTableId,
			ns: 'supplierMaint',
			checkboxWidth: 42,
			skipFields: { '0': true, state: true, supplierOperate: true },
			colWidths: supplierColWidths,
			onAfterRefresh: function () {
				syncSupplierOperateColumnScroll();
			}
		});

		$(function() {
		    layoutSupplierTableWrapHeight();
		    querySupplierList();
		    $(window).resize(function() {
		    	layoutSupplierTableWrapHeight();
		    	adjustTableHeight();
		    	setTimeout(refreshSupplierTableLayout, 100);
		    });
		});

		function layoutSupplierTableWrapHeight() {
			var $wrap = $('.supplier-table-wrap');
			if (!$wrap.length) {
				return;
			}
			var top = $wrap[0].getBoundingClientRect().top;
			var h = Math.floor(window.innerHeight - top - 14);
			h = Math.min(Math.max(h, 400), 580);
			$wrap[0].style.height = h + 'px';
			$wrap[0].style.minHeight = h + 'px';
		}

		function calculateTableHeight() {
			layoutSupplierTableWrapHeight();
			var $wrap = $('.supplier-table-wrap');
			if ($wrap.length === 0) {
				return 440;
			}
			var $bt = $wrap.find('.bootstrap-table');
			var wrapH = $wrap[0].clientHeight || $wrap.innerHeight() || 0;
			var toolbarH = $bt.find('.fixed-table-toolbar').outerHeight(true) || 0;
			var pagH = $bt.find('.fixed-table-pagination').outerHeight(true) || 46;
			var containerH = Math.floor(wrapH - toolbarH - pagH - 2);
			return Math.max(containerH, 240);
		}

		function adjustTableHeight() {
			var $table = $('#' + supplierTableId);
			if ($table.length > 0 && $table.bootstrapTable('getOptions')) {
				$table.bootstrapTable('resetView', { height: calculateTableHeight() });
			}
		}

		function escSupplierCellAttr(s) {
			return String(s == null ? '' : s)
				.replace(/&/g, '&amp;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;');
		}

		/** 文本省略显示，鼠标悬停 title 显示完整内容，移开自动隐藏 */
		function supplierCellEllipsis(value) {
			var s = (value == null || value === '') ? '-' : String(value);
			if (s === '-') {
				return s;
			}
			return '<span class="supplier-cell-ellipsis" title="' + escSupplierCellAttr(s) + '">' + escSupplierCellAttr(s) + '</span>';
		}

		/** 可点击链接 + 文本省略（公司名称列） */
		function supplierLinkCellEllipsis(value, onclick) {
			var s = (value == null || value === '') ? '-' : String(value);
			if (s === '-') {
				return s;
			}
			return '<a class="supplier-cell-ellipsis" href="javascript:void(0)" onclick="' + onclick + '" title="' + escSupplierCellAttr(s) + '">' + escSupplierCellAttr(s) + '</a>';
		}

		function syncSupplierOperateColumnScroll() {
			var $bt = $('#' + supplierTableId).closest('.bootstrap-table');
			var $rightBody = $bt.find('.fixed-columns-right .fixed-table-body');
			if ($rightBody.length === 0) {
				return;
			}
			var $mainBody = $bt.find('.fixed-table-container').children('.fixed-table-body');
			$mainBody.off('scroll.supplierOperateSync').on('scroll.supplierOperateSync', function () {
				$rightBody.scrollTop($mainBody.scrollTop());
			});
		}

		function refreshSupplierTableLayout() {
			if (supplierColResize.isResizing()) {
				return;
			}
			supplierColResize.refresh();
		}

		function querySupplierList() {
		    var options = {
		        url: prefix + "/list",
		        createUrl: prefix + "/add",
		        updateUrl: prefix + "/edit/{id}",
		        removeUrl: prefix + "/remove",
		        exportUrl: prefix + "/export",
		        sortName: "createTime",
		        sortOrder: "desc",
		        modalName: "供应商",
		        uniqueId: "listRowKey",
		        rememberSelected: true,
		        maintainSelected: true,
		        mobileResponsive: false,
		        fixedColumns: true,
		        fixedNumber: 0,
		        fixedRightNumber: 1,
		        pageList: [10, 25, 50],
		        height: calculateTableHeight(),
		        onLoadSuccess: function () {
		            layoutSupplierTableWrapHeight();
		            setTimeout(function () {
		                adjustTableHeight();
		                refreshSupplierTableLayout();
		            }, 50);
		            setTimeout(function () {
		                var $t = $('#' + supplierTableId);
		                if ($t.bootstrapTable('getOptions')) {
		                    $t.bootstrapTable('resetView', { height: calculateTableHeight() });
		                }
		                refreshSupplierTableLayout();
		            }, 200);
		            setTimeout(refreshSupplierTableLayout, 450);
		        },
		        onPostBody: function () {
		            refreshSupplierTableLayout();
		        },
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'rowIndex',
		            title: '序号',
		            align: 'center',
		            width: 60,
		            formatter: function (value, row, index) {
		                return $.table.serialNumber(index);
		            }
		        },
		        {
		            field: 'supplierId',
		            title: '供应商ID',
		            visible: false
		        },
		        {
		            field: 'supplierCode',
		            title: '供应商编码',
		            sortable: true,
		            width: 150,
		            formatter: function (value) {
		                return value || '-';
		            }
		        },
		        {
		            field: 'companyName',
		            title: '公司名称',
		            width: 180,
		            formatter: function (value, row) {
		                return supplierLinkCellEllipsis(value, '$.operate.view(\'' + row.supplierId + '\')');
		            }
		        },
		        {
		            field: 'pinyinCode',
		            title: '首拼简码',
		            width: 90,
		            formatter: function (value) {
		                return supplierCellEllipsis(value);
		            }
		        },
		        {
		            field: 'deliveryHospitals',
		            title: '医院',
		            width: 160,
		            formatter: function (value) {
		                return supplierCellEllipsis(value);
		            }
		        },
		        {
		            field: 'contactPerson',
		            title: '联系人',
		            width: 90,
		            formatter: function (value) {
		                return supplierCellEllipsis(value);
		            }
		        },
		        {
		            field: 'contactPhone',
		            title: '联系电话',
		            width: 120,
		            align: 'center',
		            formatter: function (value) {
		                return value || '-';
		            }
		        },
		        {
		            field: 'province',
		            title: '省份',
		            width: 80,
		            formatter: function (value) {
		                return supplierCellEllipsis(value);
		            }
		        },
		        {
		            field: 'city',
		            title: '城市',
		            width: 80,
		            formatter: function (value) {
		                return supplierCellEllipsis(value);
		            }
		        },
		        {
		        	field: 'status',
		        	title: '状态',
		        	align: 'center',
		        	width: 90,
		        	formatter: function (value, row) {
		        		return statusTools(row);
		        	}
		        },
		        {
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true,
		            width: 160
		        },
		        {
		            field: 'supplierOperate',
		            title: '操作',
		            align: 'center',
		            width: 160,
		            formatter: function (value, row) {
		            	var actions = [];
		                actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.supplierId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
		                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.supplierId + '\')"><i class="fa fa-remove"></i>删除</a> ');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		}

		function resetPre() {
			$("#supplier-form")[0].reset();
			$.table.search();
		}

		function statusTools(row) {
		    if (row.status == 1) {
    			return '<i class="fa fa-toggle-on text-info fa-2x supplier-status-toggle" onclick="disableSupplier(\'' + row.supplierId + '\')"></i>';
    		}
    		return '<i class="fa fa-toggle-off text-info fa-2x supplier-status-toggle" onclick="enableSupplier(\'' + row.supplierId + '\')"></i>';
		}

		function disableSupplier(supplierId) {
			$.modal.confirm("确认要停用供应商吗？", function() {
				$.operate.post(prefix + "/changeStatus", { "supplierId": supplierId, "status": "2" });
		    });
		}

		function enableSupplier(supplierId) {
			$.modal.confirm("确认要启用供应商吗？", function() {
				$.operate.post(prefix + "/changeStatus", { "supplierId": supplierId, "status": "1" });
		    });
		}

		function editSelectedSupplier() {
			var ids = $.table.selectColumns("supplierId");
			if (ids.length == 0) {
				$.modal.alertWarning("请至少选择一条记录");
				return;
			}
			if (ids.length > 1) {
				$.modal.alertWarning("请仅选择一条供应商记录");
				return;
			}
			$.operate.editTab(ids[0]);
		}

		function removeSelectedSuppliers() {
			var ids = $.table.selectColumns("supplierId");
			if (ids.length == 0) {
				$.modal.alertWarning("请至少选择一条记录");
				return;
			}
			$.modal.confirm("确认要删除选中的" + ids.length + "条供应商吗?", function() {
				$.operate.submit(prefix + "/remove", "post", "json", { "ids": ids.join() });
			});
		}

		function ensureBuiltinRoles() {
			var rows = $.table.selectColumns("supplierId");
			if (rows.length == 0) {
				$.modal.alertWarning("请选择一条供应商记录");
				return;
			}
			var uniq = [];
			$.each(rows, function(_, id) {
				if (id != null && id !== '' && $.inArray(id, uniq) < 0) {
					uniq.push(id);
				}
			});
			if (uniq.length > 1) {
				$.modal.alertWarning("请仅选择一条供应商记录");
				return;
			}
			var supplierId = uniq[0];
			$.modal.confirm("将为该供应商补齐全局内置角色（缺则创建）、增量补菜单白名单，并重绑已有用户角色。是否继续？", function() {
				$.post(prefix + "/ensureBuiltinRoles", { supplierId: supplierId }, function(data) {
					$.operate.successCallback(data);
				});
			});
		}
	</script>
</body>
</html>
