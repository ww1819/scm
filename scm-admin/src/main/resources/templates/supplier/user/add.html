<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('新增企业用户')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-supplier-user-add">
            <input type="hidden" name="userId" id="userId" required>
            <input type="hidden" name="supplierId" id="supplierId" th:value="${currentSupplier != null ? currentSupplier.supplierId : ''}" required>
            <h4 class="form-header h4">基本信息</h4>
            <div class="row">
            	<div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label">供应商编码：</label>
                        <div class="col-sm-8">
                            <input id="supplierCode" class="form-control" type="text"
                                   th:value="${currentSupplier != null ? currentSupplier.supplierCode : ''}" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">供应商：</label>
                        <div class="col-sm-8">
                            <input id="supplierName" class="form-control" type="text"
                                   th:if="${currentSupplier != null}"
                                   th:value="${currentSupplier.companyName}" readonly>
                            <select id="supplierSelect" class="form-control" th:if="${currentSupplier == null}" required>
                                <option value="">请选择供应商</option>
                                <option th:each="supplier : ${supplierList}"
                                        th:value="${supplier.supplierId}"
                                        th:text="${supplier.companyName}"
                                        th:attr="data-code=${supplier.supplierCode}">
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">登录名称：</label>
                        <div class="col-sm-8">
                            <div class="input-group">
                                <input id="loginName" class="form-control" type="text" placeholder="请选择用户" readonly required>
                                <span class="input-group-btn">
                                    <button type="button" class="btn btn-primary" onclick="selectUser()">
                                        <i class="fa fa-search"></i>选择
                                    </button>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">用户名称：</label>
                        <div class="col-sm-8">
                            <input name="userName" id="userName" class="form-control" type="text" required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label">手机号码：</label>
                        <div class="col-sm-8">
                            <input name="phonenumber" id="phonenumber" class="form-control" type="text" maxlength="11">
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label">邮箱：</label>
                        <div class="col-sm-8">
                            <input name="email" id="email" class="form-control" type="text" maxlength="50">
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label">性别：</label>
                        <div class="col-sm-8">
                            <select name="sex" id="sex" class="form-control" th:with="type=${@dict.getType('sys_user_sex')}">
                                <option value="">请选择</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label">身份证号：</label>
                        <div class="col-sm-8">
                            <input name="idCard" id="idCard" class="form-control" type="text" maxlength="18">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">主账号：</label>
                        <div class="col-sm-8">
                            <select name="isMain" class="form-control">
                                <option value="0" selected>否</option>
                                <option value="1">是</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">状态：</label>
                        <div class="col-sm-8">
                            <select name="status" class="form-control">
                                <option value="0" selected>正常</option>
                                <option value="1">停用</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="row">
        <div class="col-sm-offset-5 col-sm-10">
            <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
            <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭</button>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "supplier/user";

        $("#form-supplier-user-add").validate({
            onkeyup: false,
            rules: {
                supplierId: { required: true },
                userId: { required: true },
                userName: { required: true }
            },
            focusCleanup: true
        });

        $("#supplierSelect").on("change", function () {
            var $opt = $(this).find("option:selected");
            $("#supplierId").val($opt.val() || "");
            $("#supplierCode").val($opt.attr("data-code") || "");
        });

        function submitHandler() {
            if (!$("#userId").val()) {
                $.modal.alertWarning("请先选择用户");
                return;
            }
            if (!$("#supplierId").val()) {
                $.modal.alertWarning("请选择供应商");
                return;
            }
            if ($.validate.form()) {
                $.operate.saveTab(prefix + "/add", $("#form-supplier-user-add").serializeArray());
            }
        }

        function selectUser() {
            var options = {
                title: '选择用户',
                url: prefix + "/selectUser",
                width: "800",
                height: "500",
                callBack: function(index, layero) {
                    var body = $.modal.getChildFrame(index);
                    var rows = body.find('#bootstrap-table').bootstrapTable('getSelections');
                    if (!rows || rows.length === 0) {
                        $.modal.alertWarning("请至少选择一条记录");
                        return false;
                    }
                    if (rows.length > 1) {
                        $.modal.alertWarning("只能选择一条记录");
                        return false;
                    }
                    var row = rows[0];
                    $("#userId").val(row.userId);
                    $("#loginName").val(row.loginName || "");
                    $("#userName").val(row.userName || "");
                    $("#phonenumber").val(row.phonenumber || "");
                    $("#email").val(row.email || "");
                    $("#sex").val(row.sex || "");
                    $("#idCard").val(row.idCard || "");
                    $.modal.close(index);
                }
            };
            $.modal.openOptions(options);
        }
    </script>
</body>
</html>
