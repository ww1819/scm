<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信绑定 - 医承云配供应链云平台</title>
    <meta name="description" content="医承云配供应链云平台">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style type="text/css">
        html, body { height: 100%; }
        body.signin {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 56px;
        }
        .signinpanel {
            width: 100% !important;
            max-width: 420px !important;
            margin: 0 auto !important;
            padding: 0 !important;
        }
        .signinpanel > .row {
            margin: 0;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            padding: 26px 22px 22px;
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.20);
        }
        .signinpanel,
        .signinpanel .signin-info,
        .signinpanel .signin-info h4,
        .signinpanel .signin-info h3,
        .signinpanel .signin-info p {
            color: #333 !important;
        }
        .brand-title {
            margin: 0 0 6px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            margin: 0 0 18px;
            text-align: center;
            font-size: 13px;
            color: #666 !important;
        }
        .signinpanel form {
            background: #f7f9fc !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            border-radius: 10px !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            padding: 18px 16px 20px !important;
            margin: 0;
        }
        .form-heading {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }
        .auth-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #e8f6f3;
            color: #1ab394;
            font-size: 12px;
            font-weight: 600;
        }
        .auth-pill i { font-size: 14px; }
        .input-icon {
            position: relative;
            margin-top: 12px;
        }
        .input-icon > i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8aa0b3;
            font-size: 15px;
            z-index: 2;
        }
        .signinpanel .form-control {
            height: 44px !important;
            margin-top: 0 !important;
            padding: 10px 12px 10px 36px !important;
            font-size: 15px;
            border-radius: 6px !important;
            background-color: #fff !important;
            background-image: none !important;
            color: #222 !important;
        }
        .signinpanel .form-control:focus {
            border-color: #1ab394 !important;
        }
        .btn-bind {
            display: block;
            width: 100%;
            height: 44px;
            margin-top: 18px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            background: #1c84c6;
            border-color: #1c84c6;
            color: #fff;
        }
        .btn-bind:hover,
        .btn-bind:focus,
        .btn-bind:active {
            background: #1a7bb9 !important;
            border-color: #1a7bb9 !important;
            color: #fff;
        }
        .btn-bind[disabled] { opacity: 0.65; }
        .error-box {
            text-align: center;
            padding: 18px 8px 8px;
        }
        .error-box .error-icon {
            width: 52px;
            height: 52px;
            line-height: 52px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #fdecea;
            color: #c62828;
            font-size: 22px;
        }
        .error-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            color: #c62828 !important;
        }
        .hint {
            margin: 14px 0 0;
            text-align: center;
            font-size: 12px;
            color: #888 !important;
        }
        .login-icp-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 10px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            z-index: 50;
        }
        .login-icp-footer a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
        }
        .toast {
            display: none;
            position: fixed;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 99;
            max-width: 80%;
        }
    </style>
</head>
<body class="signin">
<div class="signinpanel">
    <div class="row">
        <div class="col-sm-12">
            <div class="signin-info">
                <h4 class="brand-title">医承云配供应链云平台</h4>
                <p class="brand-sub">微信账号绑定</p>
                <div class="error-box" th:if="${!ready}">
                    <div class="error-icon"><i class="fa fa-exclamation"></i></div>
                    <p th:text="${errorMsg}">请从微信服务号菜单进入</p>
                </div>
                <form id="bindForm" th:if="${ready}" autocomplete="off" onsubmit="return false;">
                    <h3 class="form-heading">登录并绑定</h3>
                    <span class="auth-pill"><i class="fa fa-weixin"></i> 已获取微信授权</span>
                    <div class="input-icon">
                        <i class="fa fa-user"></i>
                        <input type="text" id="username" name="username" class="form-control" placeholder="用户名" autocomplete="username"/>
                    </div>
                    <div class="input-icon">
                        <i class="fa fa-lock"></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="密码" autocomplete="current-password"/>
                    </div>
                    <button type="button" class="btn btn-bind" id="btnBind">登录并绑定</button>
                </form>
                <p class="hint">请在微信内打开本页，使用系统账号完成绑定</p>
            </div>
        </div>
    </div>
</div>
<div class="login-icp-footer">
    <a th:href="${icpLink}" target="_blank" rel="noopener noreferrer" th:text="${icpNo}">冀ICP备2026009090号-1</a>
</div>
<div class="toast" id="toast"></div>
<script th:inline="javascript"> var ctx = [[@{/}]]; </script>
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script>
function toast(msg) {
    var $t = $("#toast");
    $t.text(msg).stop(true, true).fadeIn(120);
    setTimeout(function () { $t.fadeOut(180); }, 2200);
}
$(function () {
    function submitBind() {
        var username = $.trim($("#username").val());
        var password = $("#password").val();
        if (!username) { toast("请输入用户名"); return; }
        if (!password) { toast("请输入密码"); return; }
        var $btn = $("#btnBind");
        $btn.prop("disabled", true).text("正在绑定...");
        $.ajax({
            type: "post",
            url: ctx + "wx/bind/login",
            dataType: "json",
            data: { username: username, password: password },
            success: function (r) {
                if (r && r.code === 0) {
                    location.href = ctx + "wx/bind/success";
                } else {
                    toast((r && r.msg) || "登录失败");
                    $btn.prop("disabled", false).text("登录并绑定");
                }
            },
            error: function () {
                toast("网络异常，请稍后重试");
                $btn.prop("disabled", false).text("登录并绑定");
            }
        });
    }
    $("#btnBind").on("click", submitBind);
    $("#bindForm").on("keydown", function (e) {
        if (e.keyCode === 13) {
            submitBind();
        }
    });
});
</script>
</body>
</html>
