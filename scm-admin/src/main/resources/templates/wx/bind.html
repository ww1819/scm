<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信绑定 - 医承云配供应链云平台</title>
    <meta name="description" content="医承云配供应链云平台">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style type="text/css">
        html, body { height: 100%; }
        body.signin {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 56px;
        }
        body.signin.has-accounts {
            justify-content: flex-start;
            padding-top: 28px;
        }
        .account-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }
        .account-head h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }
        .btn-add {
            flex: 0 0 auto;
            height: 32px;
            padding: 0 12px;
            border: none;
            border-radius: 16px;
            background: #1c84c6;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }
        .account-card {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-top: 10px;
            background: #f7f9fc;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .account-main {
            flex: 1;
            min-width: 0;
            padding: 12px 12px 12px 14px;
            color: #222;
            text-decoration: none;
        }
        .account-main:hover,
        .account-main:focus {
            color: #222;
            text-decoration: none;
        }
        .account-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
        }
        .account-login {
            margin-top: 2px;
            color: #1c84c6;
            font-size: 13px;
        }
        .account-sup {
            margin-top: 6px;
            color: #667788;
            font-size: 12px;
            line-height: 1.45;
        }
        .account-go {
            margin-top: 8px;
            color: #1ab394;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-unbind {
            flex: 0 0 72px;
            border: none;
            border-left: 1px solid rgba(0, 0, 0, 0.06);
            background: #fff;
            color: #c62828;
            font-size: 13px;
        }
        .form-cancel {
            display: block;
            width: 100%;
            height: 40px;
            margin-top: 10px;
            border: 1px solid #d9e2ec;
            border-radius: 6px;
            background: #fff;
            color: #667788;
            font-size: 14px;
        }
        .signinpanel {
            width: 100% !important;
            max-width: 420px !important;
            margin: 0 auto !important;
            padding: 0 !important;
        }
        .signinpanel > .row {
            margin: 0;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            padding: 26px 22px 22px;
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.20);
        }
        .signinpanel,
        .signinpanel .signin-info,
        .signinpanel .signin-info h4,
        .signinpanel .signin-info h3,
        .signinpanel .signin-info p {
            color: #333 !important;
        }
        .brand-title {
            margin: 0 0 6px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            margin: 0 0 18px;
            text-align: center;
            font-size: 13px;
            color: #666 !important;
        }
        .signinpanel form {
            background: #f7f9fc !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            border-radius: 10px !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            padding: 18px 16px 20px !important;
            margin: 0;
        }
        .has-accounts .signinpanel form {
            margin-top: 16px !important;
        }
        .form-heading {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }
        .auth-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #e8f6f3;
            color: #1ab394;
            font-size: 12px;
            font-weight: 600;
        }
        .auth-pill i { font-size: 14px; }
        .input-icon {
            position: relative;
            margin-top: 12px;
        }
        .input-icon > i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8aa0b3;
            font-size: 15px;
            z-index: 2;
        }
        .signinpanel .form-control {
            height: 44px !important;
            margin-top: 0 !important;
            padding: 10px 12px 10px 36px !important;
            font-size: 15px;
            border-radius: 6px !important;
            background-color: #fff !important;
            background-image: none !important;
            color: #222 !important;
        }
        .signinpanel .form-control:focus {
            border-color: #1ab394 !important;
        }
        .btn-bind {
            display: block;
            width: 100%;
            height: 44px;
            margin-top: 18px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            background: #1c84c6;
            border-color: #1c84c6;
            color: #fff;
        }
        .btn-bind:hover,
        .btn-bind:focus,
        .btn-bind:active {
            background: #1a7bb9 !important;
            border-color: #1a7bb9 !important;
            color: #fff;
        }
        .btn-bind[disabled] { opacity: 0.65; }
        .error-box {
            text-align: center;
            padding: 18px 8px 8px;
        }
        .error-box .error-icon {
            width: 52px;
            height: 52px;
            line-height: 52px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #fdecea;
            color: #c62828;
            font-size: 22px;
        }
        .error-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            color: #c62828 !important;
        }
        .hint {
            margin: 14px 0 0;
            text-align: center;
            font-size: 12px;
            color: #888 !important;
        }
        .login-icp-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 10px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            z-index: 50;
        }
        .login-icp-footer a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
        }
        .toast {
            display: none;
            position: fixed;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 99;
            max-width: 80%;
        }
    </style>
</head>
<body class="signin" th:classappend="${hasAccounts} ? ' has-accounts' : ''">
<div class="signinpanel">
    <div class="row">
        <div class="col-sm-12">
            <div class="signin-info">
                <h4 class="brand-title">医承云配供应链云平台</h4>
                <p class="brand-sub">微信账号绑定</p>
                <div class="error-box" th:if="${!ready}">
                    <div class="error-icon"><i class="fa fa-exclamation"></i></div>
                    <p th:text="${errorMsg}">请从微信服务号菜单进入</p>
                </div>
                <div th:if="${ready and hasAccounts}">
                    <div class="account-head">
                        <h3>已绑定账号</h3>
                        <button type="button" class="btn-add" id="btnShowAdd">添加绑定</button>
                    </div>
                    <div class="account-card" th:each="a : ${accounts}">
                        <a class="account-main" th:href="@{/wx/order/list(userId=${a.userId})}">
                            <div class="account-title" th:text="${a.userName != null and a.userName != '' ? a.userName : a.loginName}">账号</div>
                            <div class="account-login" th:text="${a.loginName}">login</div>
                            <div class="account-sup" th:text="${a.supplierNames != null and a.supplierNames != '' ? a.supplierNames : '未关联供应商'}">供应商</div>
                            <div class="account-go">查看历史订单 &gt;</div>
                        </a>
                        <button type="button" class="btn-unbind" th:attr="data-userid=${a.userId},data-name=${a.loginName}">解除绑定</button>
                    </div>
                </div>
                <form id="bindForm" th:if="${ready}" th:style="${hasAccounts} ? 'display:none' : null" autocomplete="off" onsubmit="return false;">
                    <h3 class="form-heading" th:text="${hasAccounts} ? '添加绑定账号' : '登录并绑定'">登录并绑定</h3>
                    <span class="auth-pill"><i class="fa fa-weixin"></i> 已获取微信授权</span>
                    <div class="input-icon">
                        <i class="fa fa-user"></i>
                        <input type="text" id="username" name="username" class="form-control" placeholder="用户名" autocomplete="username"/>
                    </div>
                    <div class="input-icon">
                        <i class="fa fa-lock"></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="密码" autocomplete="current-password"/>
                    </div>
                    <button type="button" class="btn btn-bind" id="btnBind">登录并绑定</button>
                    <button type="button" class="form-cancel" id="btnCancelAdd" th:if="${hasAccounts}">取消</button>
                </form>
                <p class="hint">仅支持绑定供应商账号，同一微信可绑定多个账号</p>
            </div>
        </div>
    </div>
</div>
<div class="login-icp-footer">
    <a th:href="${icpLink}" target="_blank" rel="noopener noreferrer" th:text="${icpNo}">冀ICP备2026009090号-1</a>
</div>
<div class="toast" id="toast"></div>
<script th:inline="javascript">
var ctx = [[@{/}]];
var toastMsg = [[${toastMsg}]] || "";
</script>
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script>
function toast(msg) {
    var $t = $("#toast");
    $t.text(msg).stop(true, true).fadeIn(120);
    setTimeout(function () { $t.fadeOut(180); }, 2200);
}
function showAddForm() {
    $("#bindForm").show();
    $("#btnShowAdd").hide();
}
function hideAddForm() {
    $("#bindForm").hide();
    $("#btnShowAdd").show();
}
$(function () {
    if (toastMsg) { toast(toastMsg); }
    $("#btnShowAdd").on("click", showAddForm);
    $("#btnCancelAdd").on("click", hideAddForm);
    function submitBind() {
        var username = $.trim($("#username").val());
        var password = $("#password").val();
        if (!username) { toast("请输入用户名"); return; }
        if (!password) { toast("请输入密码"); return; }
        var $btn = $("#btnBind");
        $btn.prop("disabled", true).text("正在绑定...");
        $.ajax({
            type: "post",
            url: ctx + "wx/bind/login",
            dataType: "json",
            data: { username: username, password: password },
            success: function (r) {
                if (r && r.code === 0) {
                    location.href = ctx + "wx/bind";
                } else {
                    toast((r && r.msg) || "登录失败");
                    $btn.prop("disabled", false).text("登录并绑定");
                }
            },
            error: function () {
                toast("网络异常，请稍后重试");
                $btn.prop("disabled", false).text("登录并绑定");
            }
        });
    }
    $("#btnBind").on("click", submitBind);
    $("#bindForm").on("keydown", function (e) {
        if (e.keyCode === 13) {
            submitBind();
        }
    });
    $(".btn-unbind").on("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var userId = $(this).attr("data-userid");
        var name = $(this).attr("data-name") || "";
        if (!userId) { return; }
        if (!window.confirm("确定解除绑定账号 " + name + " 吗？")) { return; }
        var $btn = $(this).prop("disabled", true);
        $.ajax({
            type: "post",
            url: ctx + "wx/bind/unbind",
            dataType: "json",
            data: { userId: userId },
            success: function (r) {
                if (r && r.code === 0) {
                    location.href = ctx + "wx/bind";
                } else {
                    toast((r && r.msg) || "解绑失败");
                    $btn.prop("disabled", false);
                }
            },
            error: function () {
                toast("网络异常，请稍后重试");
                $btn.prop("disabled", false);
            }
        });
    });
});
</script>
</body>
</html>
