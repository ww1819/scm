<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单详情 - 医承云配供应链云平台</title>
    <meta name="description" content="医承云配供应链云平台">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            color: #1f2d3d;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 12px 12px 20px;
        }
        .page-head { padding: 8px 4px 14px; }
        .nav-row {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }
        .nav-row a {
            color: #1c84c6;
            font-size: 13px;
            text-decoration: none;
        }
        .brand {
            margin: 0;
            font-size: 13px;
            color: #1ab394;
            font-weight: 600;
        }
        .title {
            margin: 4px 0 0;
            font-size: 20px;
            font-weight: 700;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(31, 45, 61, 0.06);
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .kv {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f2f5;
            font-size: 14px;
            line-height: 1.45;
        }
        .kv:last-child { border-bottom: none; }
        .k { color: #8899aa; flex: 0 0 88px; }
        .v { flex: 1; text-align: right; word-break: break-all; font-weight: 600; }
        .amount { color: #e6a23c; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            background: #e8f6f3;
            color: #1ab394;
            font-size: 12px;
            font-weight: 600;
        }
        .sec-title {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 700;
        }
        .item {
            background: #f7f9fc;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .item:last-child { margin-bottom: 0; }
        .item-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .item-idx {
            flex: 0 0 auto;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 6px;
            background: #e8f6f3;
            color: #1ab394;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            line-height: 22px;
        }
        .item-head-main { flex: 1; min-width: 0; }
        .item-name {
            font-size: 15px;
            font-weight: 650;
            line-height: 1.4;
            word-break: break-word;
        }
        .item-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .tag {
            max-width: 100%;
            padding: 1px 6px;
            border: 1px solid #e8edf2;
            border-radius: 4px;
            background: #fff;
            color: #6b7c8d;
            font-size: 11px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-spec {
            margin-top: 4px;
            color: #6b7c8d;
            font-size: 12px;
            line-height: 1.45;
            word-break: break-word;
        }
        .item-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #e8edf2;
        }
        .metric {
            min-width: 0;
            text-align: center;
        }
        .metric-label {
            display: block;
            margin-bottom: 4px;
            color: #8899aa;
            font-size: 11px;
        }
        .metric-value {
            display: block;
            color: #1f2d3d;
            font-size: 13px;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1.35;
            word-break: break-all;
        }
        .metric-amount .metric-value { color: #e6a23c; }
        .error-box {
            text-align: center;
            padding: 36px 12px;
        }
        .error-box p {
            margin: 0 0 16px;
            font-size: 15px;
            color: #606266;
            line-height: 1.6;
        }
        .btn-bind {
            display: inline-block;
            background: #1ab394;
            color: #fff;
            text-decoration: none;
            border-radius: 22px;
            padding: 10px 22px;
            font-size: 14px;
        }
        .footer {
            margin-top: 8px;
            padding: 8px 0 4px;
            text-align: center;
            font-size: 12px;
        }
        .footer a { color: #99a9bf; text-decoration: none; }
        .empty { color: #99a9bf; text-align: center; padding: 12px 0; font-size: 13px; }
    </style>
</head>
<body>
<div class="page-head">
    <p class="brand">医承云配供应链云平台</p>
    <h1 class="title">订单详情</h1>
    <div class="nav-row">
        <a th:if="${listUserId != null}" th:href="@{/wx/order/list(userId=${listUserId})}">返回订单列表</a>
        <a th:href="@{/wx/bind}">账号管理</a>
    </div>
</div>

<div class="card error-box" th:if="${ready == false}">
    <p th:text="${errorMsg}">无法查看订单</p>
    <a class="btn-bind" th:if="${needBind}" th:href="${bindUrl}">去绑定账号</a>
</div>

<div th:if="${ready}">
    <div class="card">
        <div class="kv"><span class="k">订单编号</span><span class="v" th:text="${order.orderNo}">-</span></div>
        <div class="kv"><span class="k">状态</span><span class="v"><span class="badge" th:text="${statusText}">-</span></span></div>
        <div class="kv"><span class="k">医院</span><span class="v" th:text="${order.hospitalName}">-</span></div>
        <div class="kv"><span class="k">供应商</span><span class="v" th:text="${order.supplierName}">-</span></div>
        <div class="kv"><span class="k">下单时间</span><span class="v" th:text="${order.orderDate != null ? #dates.format(order.orderDate, 'yyyy-MM-dd HH:mm') : '-'}">-</span></div>
        <div class="kv"><span class="k">订单金额</span><span class="v amount" th:text="${order.orderAmount != null ? #numbers.formatDecimal(order.orderAmount, 1, 4) + ' 元' : '-'}">-</span></div>
        <div class="kv"><span class="k">要货仓库</span><span class="v" th:text="${(order.warehouse != null and order.warehouse != '') ? order.warehouse : '-'}">-</span></div>
        <div class="kv"><span class="k">申请科室</span><span class="v" th:text="${(order.department != null and order.department != '') ? order.department : ((order.orderDeptName != null and order.orderDeptName != '') ? order.orderDeptName : '-')}">-</span></div>
        <div class="kv" th:if="${order.remark != null and order.remark != ''}"><span class="k">备注</span><span class="v" th:text="${order.remark}">-</span></div>
    </div>

    <div class="card">
        <h2 class="sec-title">明细</h2>
        <div th:if="${details == null or #lists.isEmpty(details)}" class="empty">暂无明细</div>
        <div class="item" th:each="d,stat : ${details}">
            <div class="item-head">
                <span class="item-idx" th:text="${stat.count}">1</span>
                <div class="item-head-main">
                    <div class="item-name" th:text="${d.materialName}">物资</div>
                    <div class="item-meta">
                        <span class="tag" th:if="${d.materialCode != null and d.materialCode != ''}" th:text="${d.materialCode}">编码</span>
                        <span class="tag" th:if="${d.unit != null and d.unit != ''}" th:text="${d.unit}">单位</span>
                    </div>
                    <div class="item-spec" th:if="${d.specification != null and d.specification != ''}" th:text="${d.specification}">规格</div>
                </div>
            </div>
            <div class="item-metrics">
                <div class="metric">
                    <span class="metric-label">数量</span>
                    <span class="metric-value" th:text="${d.orderQuantity != null ? #numbers.formatDecimal(d.orderQuantity, 1, 4) : '-'}">10.0000</span>
                </div>
                <div class="metric">
                    <span class="metric-label">单价</span>
                    <span class="metric-value" th:text="${d.purchasePrice != null ? #numbers.formatDecimal(d.purchasePrice, 1, 4) : '-'}">12.3456</span>
                </div>
                <div class="metric metric-amount">
                    <span class="metric-label">金额</span>
                    <span class="metric-value" th:text="${d.amount != null ? #numbers.formatDecimal(d.amount, 1, 4) : '-'}">123.4567</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <a th:href="${icpLink}" target="_blank" rel="noopener noreferrer" th:text="${icpNo}">冀ICP备2026009090号-1</a>
</div>
</body>
</html>
