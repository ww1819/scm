<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>绑定成功 - 医承云配供应链云平台</title>
    <meta name="description" content="医承云配供应链云平台">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style type="text/css">
        html, body { height: 100%; }
        body.signin {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 56px;
        }
        .signinpanel {
            width: 100% !important;
            max-width: 420px !important;
            margin: 0 auto !important;
            padding: 0 !important;
        }
        .signinpanel > .row {
            margin: 0;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            padding: 36px 24px 28px;
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.20);
            text-align: center;
        }
        .brand-title {
            margin: 0 0 22px;
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        .ok-icon {
            width: 64px;
            height: 64px;
            line-height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #1ab394;
            color: #fff;
            font-size: 30px;
            box-shadow: 0 8px 18px rgba(26, 179, 148, 0.35);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        .desc {
            margin: 0;
            font-size: 15px;
            line-height: 1.75;
            color: #666;
        }
        .name {
            color: #1c84c6;
            font-weight: 700;
        }
        .hint {
            margin: 18px 0 0;
            font-size: 12px;
            color: #888;
        }
        .login-icp-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 10px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            z-index: 50;
        }
        .login-icp-footer a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
        }
    </style>
</head>
<body class="signin">
<div class="signinpanel">
    <div class="row">
        <div class="col-sm-12">
            <h4 class="brand-title">医承云配供应链云平台</h4>
            <div class="ok-icon"><i class="fa fa-check"></i></div>
            <h1>绑定成功</h1>
            <p class="desc">账号 <span class="name" th:text="${loginName}">user</span> 已与当前微信关联，<br>后续可用于服务号消息通知。</p>
            <p class="hint">可关闭本页</p>
        </div>
    </div>
</div>
<div class="login-icp-footer">
    <a th:href="${icpLink}" target="_blank" rel="noopener noreferrer" th:text="${icpNo}">冀ICP备2026009090号-1</a>
</div>
</body>
</html>
