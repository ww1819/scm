<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>绑定成功</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f5f6f8;
            color: #1f2329;
        }
        .wrap {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
        }
        .ok {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #07c160;
            color: #fff;
            font-size: 36px;
            line-height: 64px;
            margin-bottom: 18px;
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0; color: #646a73; font-size: 15px; line-height: 1.7; }
        .name { color: #1f2329; font-weight: 600; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="ok">✓</div>
    <h1>绑定成功</h1>
    <p>账号 <span class="name" th:text="${loginName}">user</span> 已与当前微信关联。<br>可关闭本页，后续将用于服务号消息通知。</p>
</div>
</body>
</html>
